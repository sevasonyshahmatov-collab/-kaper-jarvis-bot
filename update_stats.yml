name: Броски и вратари (QuantHockey)

on:
  schedule:
    # 06:00 по Москве = 03:00 UTC: к этому времени ночные матчи уже учтены на сайте
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # ручной запуск кнопкой на GitHub

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Скачать код репозитория
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Загрузить броски и вратарей в таблицу
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python update_stats.py
