# Эмблемы и цвета футбольных клубов (ESPN): на ветках claude/team-dev-* при изменении render/emblems/football_fetch.txt
# запускает tools/emblems_football_fetch.py и коммитит PNG 500 px и teams.json в ту же ветку.
name: Эмблемы футбольных клубов

on:
  push:
    branches: ['claude/team-dev-**']
    paths: ['render/emblems/football_fetch.txt']

permissions:
  contents: write

jobs:
  emblems:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pillow>=11"
      - run: python tools/emblems_football_fetch.py
      - name: Закоммитить эмблемы
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add render/emblems
          git diff --cached --quiet || git commit -m "Football emblems and colors from ESPN"
          git push
