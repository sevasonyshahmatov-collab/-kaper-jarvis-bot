# Конвейер шортсов (team/reels_daily/make.py, docs/handoff/CONVEYOR.md): матчи дня, прогноз по правилу владельца (кэф 1,6–2,3),
# один матч — один ролик, шаблоны по очереди; владельцу в Telegram ролик со звуком и без + тексты для YouTube.
# Оба — рано утром по Красноярску, чтобы ролики выходили за 12–15 ч до матча.
# Ролики — артефактом запуска на 2 дня (владелец 17.10), в репозиторий не кладём.
# Секреты: TG_BOT_TOKEN (бот таблиц), TRACKS_KEY (треки, ветка claude/team-dev-tracks-v2).
name: Шортсы — конвейер

on:
  schedule:
    # владелец 17.10: ролики заранее, за 12–15 ч до матча — к утру по Красноярску (МСК+4); день — дата по Москве
    - cron: '0 23 * * *'          # НХЛ — 02:00 МСК (06:00 Красноярск): матчи ближайшей ночи (игровой день НХЛ = дата по Москве)
    - cron: '30 23 * * *'         # КХЛ — 02:30 МСК (06:30 Красноярск): матчи этого дня (по расписанию — только из main)
  workflow_dispatch:
    inputs:
      league:
        description: 'Лига: khl или nhl'
        required: true
        default: 'khl'
      day:
        description: 'День ГГГГ-ММ-ДД (пусто — сегодня по Москве)'
        required: false
      max:
        description: 'Сколько роликов максимум (0 — на каждый матч с прогнозом)'
        required: false
        default: '0'
  repository_dispatch:
    types: [reels]                # из бота/таблицы: client_payload {"league": "khl", "day": "…", "max": 0}
  push:                           # ручной запуск из ветки claude/**: записать в team/reels_daily/RUN «khl 2026-10-17 [сколько роликов] [Клуб,Клуб]» и запушить
    branches: ['claude/**']
    paths: ['team/reels_daily/RUN']

permissions:
  contents: read

concurrency:
  group: reels-daily-${{ github.event.inputs.league || github.event.client_payload.league || github.event.schedule || 'push' }}-${{ github.event.inputs.day || github.event.client_payload.day || 'today' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      day: ${{ steps.day.outputs.day }}
      league: ${{ steps.day.outputs.league }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pillow>=11" numpy requests
      - id: day
        env:
          DAY_IN: ${{ github.event.inputs.day || github.event.client_payload.day }}
          LG_IN: ${{ github.event.inputs.league || github.event.client_payload.league }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = push ]; then read -r LG_IN DAY_IN MAX_RUN ONLY_RUN < team/reels_daily/RUN || true; fi
          echo "max=${MAX_RUN:-}" >> "$GITHUB_OUTPUT"
          echo "only=${ONLY_RUN:-}" >> "$GITHUB_OUTPUT"
          [ "$CRON" = '0 23 * * *' ] && LG_IN=nhl
          lg="${LG_IN:-khl}"; lg="${lg,,}"
          [[ "$lg" =~ ^(khl|nhl)$ ]] || { echo "плохая лига: $lg"; exit 1; }
          d="${DAY_IN:-$(TZ=Europe/Moscow date +%F)}"
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "плохой день: $d"; exit 1; }
          echo "day=$d" >> "$GITHUB_OUTPUT"
          echo "league=$lg" >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          MAX_IN: ${{ github.event.inputs.max || github.event.client_payload.max || steps.day.outputs.max || '0' }}
          REELS_ONLY: ${{ steps.day.outputs.only }}             # «Сочи,Локомотив» — только матчи этих клубов
        run: |
          m="$MAX_IN"; [[ "$m" =~ ^[0-9]{1,2}$ ]] || m=0
          python team/reels_daily/make.py plan "${{ steps.day.outputs.league }}" "${{ steps.day.outputs.day }}" --max "$m" --per 3
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: out/reels_daily/
          retention-days: 2

  render:
    needs: plan
    if: needs.plan.outputs.parts != '[]' && needs.plan.outputs.parts != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install "pillow>=11" numpy requests
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: out/reels_daily/
      - name: Собрать и отправить
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TRACKS_KEY: ${{ secrets.TRACKS_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}           # загрузка на YouTube (team/reels_daily/youtube.py); нет — только Telegram
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: PYTHONPATH=render python team/reels_daily/make.py render "${{ needs.plan.outputs.league }}" "${{ needs.plan.outputs.day }}" --part ${{ matrix.part }}
      - name: Сохранить ролики (2 дня)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ needs.plan.outputs.league }}-${{ needs.plan.outputs.day }}-${{ matrix.part }}
          path: out/reels_daily/**/*.mp4
          if-no-files-found: ignore
          retention-days: 2
