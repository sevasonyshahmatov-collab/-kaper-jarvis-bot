# Фото игроков КХЛ без белого фона (черновик 14.11): hockey/khl_cut.py -> hockey/data/kph/. Запуск — изменить hockey/kph_run.txt.
name: Фото КХЛ без фона v3a

on:
  push:
    branches: ['claude/team-dev-**', 'claude/site-v3a-draft-**']
    paths: ['team/site/v3a/hockey/kph_run.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-human-seg-v1
      - run: pip install rembg onnxruntime pillow requests
      - name: Вырезать фон
        env:
          KPH_BUDGET: '2700'
        run: python team/site/v3a/hockey/khl_cut.py
      - name: Закоммитить
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team/site/v3a/hockey/data/kph
          git diff --cached --quiet && exit 0
          git commit -q -m "Фото КХЛ без фона: $(ls team/site/v3a/hockey/data/kph | wc -l) файлов"
          for i in 1 2 3 4 5; do
            if git fetch -q --depth=50 origin "$GITHUB_REF_NAME" && git rebase -q FETCH_HEAD && git push; then exit 0; fi
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
