# Фото для карточек лиг v3a: Commons -> rembg -> assets/leaguecards/cand. Триггер — изменение assets/leaguecards/run.txt.
name: Фото карточек лиг v3a

on:
  push:
    branches: ['claude/team-dev-**', 'claude/site-v3a-draft-**']  # черновик 14.11: поиск фото из ветки-черновика
    paths: ['team/site/v3a/assets/leaguecards/run.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  players:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-birefnet-v1
      - run: pip install rembg onnxruntime pillow requests
      - name: Фото высокого качества (если есть hq.json, черновик 14.11)
        run: if [ -f team/site/v3a/assets/leaguecards/hq.json ]; then python team/site/v3a/assets/leaguecards/lc_hq.py; fi
      - name: Поиск (если есть discover.json)
        if: hashFiles('team/site/v3a/assets/leaguecards/hq.json') == ''
        run: if [ -f team/site/v3a/assets/leaguecards/discover.json ]; then python team/site/v3a/assets/leaguecards/lc_discover.py; fi
      - name: Вырезки (если нет discover.json)
        if: hashFiles('team/site/v3a/assets/leaguecards/hq.json') == ''
        run: if [ ! -f team/site/v3a/assets/leaguecards/discover.json ]; then python team/site/v3a/assets/leaguecards/lc_players.py; fi
      - name: Закоммитить вырезки
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team/site/v3a/assets/leaguecards/cand
          git diff --cached --quiet || git commit -m "Карточки лиг v3a: вырезки кандидатов"
          for i in 1 2 3 4 5; do
            git fetch -q --depth=50 origin "$GITHUB_REF_NAME" && git rebase -q FETCH_HEAD && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
