# Разведка данных для мини-приложения (team/site/app_data/probe.py, владелец 25.10): какие сведения о командах и игроках
# отдают API КХЛ и НХЛ. Запуск из ветки claude/**: изменить team/site/app_data/PROBE и запушить; отчёт — коммитом в ту же
# ветку (team/site/app_data/probe_out/), чтобы облачная сессия прочитала его без логов. Ничего не публикует.
name: Мини-приложение — разведка данных

on:
  push:
    branches: ['claude/**']
    paths: ['team/site/app_data/PROBE']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests "pillow>=11" numpy cairosvg
      - name: Разведка
        run: python team/site/app_data/probe.py out/app_probe
      - name: Данные команд (проба сборщика)
        continue-on-error: true
        run: |
          python team/site/app_data/build.py "$(TZ=Europe/Moscow date +%F)" out/app_data 2>&1 | grep -E "APP|KHL сыграно|Traceback|Error" | tail -40 > out/app_probe/build_log.txt || true
          cp out/app_data/teams.json out/app_probe/ 2>/dev/null || true
      - name: Сохранить в ветку
        if: github.event_name == 'push'
        run: |
          mkdir -p team/site/app_data/probe_out && cp out/app_probe/* team/site/app_data/probe_out/
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          git add team/site/app_data/probe_out && git commit -qm "Мини-приложение: результат разведки данных" && git push origin "HEAD:${GITHUB_REF_NAME}"
