# Портреты футболистов для сайта v3a: на ветках claude/team-dev-* при изменении team/site/v3a/football/headshots_run.txt
# запускает players_headshots.py (фото Commons -> лицо -> обрезка -> без фона -> 256x256 WEBP) и коммитит результат в ветку.
name: Портреты футболистов v3a

on:
  push:
    branches: ['claude/team-dev-**']
    paths: ['team/site/v3a/football/headshots_run.txt']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  headshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-human-seg-v1
      - run: pip install "opencv-python-headless<5" rembg onnxruntime pillow requests
      - name: Один opencv (headless), без конфликта пакетов
        run: |
          pip uninstall -y opencv-python opencv-contrib-python opencv-contrib-python-headless opencv-python-headless
          pip install "opencv-python-headless<5"
          python -c "import cv2,numpy;print('CV2',cv2.__version__,cv2.__file__,numpy.__version__,hasattr(cv2,'CascadeClassifier'))"
      - run: python team/site/v3a/football/players_headshots.py
        env:
          HEADSHOTS_BUDGET: '2900'
      - name: Закоммитить портреты
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team/site/v3a/football/data
          git diff --cached --quiet || git commit -m "Портреты футболистов v3a: обработанные фото"
          for i in 1 2 3 4 5; do
            git fetch -q --depth=50 origin "$GITHUB_REF_NAME" && git rebase -q FETCH_HEAD && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
