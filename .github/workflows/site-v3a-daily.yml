# Ежедневное обновление данных макета сайта v3a (владелец 04.11): хоккей (сезон, таблицы, матчи, игроки), футбол (ESPN: матчи,
# таблицы, составы, тренды), линии (Фонбет / Pinnacle / приложение КХЛ / ESPN) и вероятности модели на ближайшие 2 дня.
# Код — team/site/v3a/daily/run.py (описание и формат ключей — daily/README.md); данные коммитятся в ту же ветку.
# Запуск: вручную, по изменению team/site/v3a/daily/run.txt и по расписанию — cron из main (site-v3a-daily-cron.yml, ветка
# claude/site-v3a-daily-cron): cron из не-главной ветки GitHub не запускает.
name: Данные v3a — ежедневное обновление

on:
  push:
    branches: ['claude/team-dev-**']
    paths: ['team/site/v3a/daily/run.txt']
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Только обновить папку new/ на сайте, без сбора данных (yes / no)'
        required: false
        default: 'no'
      draft:
        description: 'Черновик для просмотра владельцем: собрать папку draft/ на сайте из этой ветки, без данных (yes / no)'
        required: false
        default: 'no'

permissions:
  contents: write

concurrency:
  group: site-v3a-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_REPO: ${{ vars.SITE_REPO }}
      PUBLISH_ONLY: ${{ github.event.inputs.publish_only }}
      # черновик (14.11): ветка-черновик или draft=yes — данные не собираем, публикуем только папку draft/ (живые страницы не трогаем)
      DRAFT: ${{ github.event.inputs.draft == 'yes' || contains(github.ref_name, 'draft') }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false      # ключ записи не лежит в .git/config во время pip install (проверка 16.11)
      - uses: actions/setup-python@v5
        if: env.PUBLISH_ONLY != 'yes' && env.DRAFT != 'true'
        with:
          python-version: '3.11'
      - run: pip install requests numpy brotli pillow
        if: env.PUBLISH_ONLY != 'yes' && env.DRAFT != 'true'
      - name: Конвейер данных
        if: env.PUBLISH_ONLY != 'yes' && env.DRAFT != 'true'
        run: python team/site/v3a/daily/run.py
      - name: Закоммитить данные
        if: always() && env.PUBLISH_ONLY != 'yes' && env.DRAFT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # ключ записи — только в этом шаге, переменными окружения git, не на диске (проверка 16.11)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"; export GIT_CONFIG_VALUE_0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # страницы матчей и клубов (<лига>/…, seo/build_match.py) — тоже: без них новые матчи не появлялись (09.11)
          git add -A team/site/v3a/data team/site/v3a/assets/data team/site/v3a/team/season.json team/site/v3a/football/data team/site/v3a/hockey/data team/site/v3a/sitemap.xml team/site/v3a/robots.txt team/site/v3a/*.html team/site/v3a/hockey/*.html team/site/v3a/football/*.html team/site/v3a/team/index.html \
            team/site/v3a/khl team/site/v3a/nhl team/site/v3a/epl team/site/v3a/laliga team/site/v3a/seriea team/site/v3a/bundesliga team/site/v3a/ligue1 team/site/v3a/rpl team/site/v3a/ucl team/site/v3a/uel
          git diff --cached --quiet && { echo "данные не изменились"; exit 0; }
          git commit -q -m "Данные v3a: ежедневное обновление $(TZ=Europe/Moscow date '+%d.%m %H:%M') МСК (run ${{ github.run_number }})"
          git stash -q -u || true  # остатки конвейера вне git add мешали rebase (runs 6–10)
          for i in 1 2 3 4 5; do
            git fetch -q --depth=50 origin "$GITHUB_REF_NAME" && git rebase -q -X theirs FETCH_HEAD && git push && exit 0  # спор в файлах данных — берём свежесобранные (11.11)
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
      # Новый сайт рядом со старым (владелец 13.11): папка new/ в репозитории сайта обновляется сама после данных.
      # Трогаем только new/ — остальной сайт собирает site.yml. Нет SITE_REPO / SITE_TOKEN — шаг пропускается.
      # Куда публиковать (проверка 16.11): живой сайт — ТОЛЬКО из ветки claude/team-dev-site-v3a; ветка со словом draft
      # (или draft=yes на этой ветке) — только папка draft/; любая другая ветка — на сайт ничего.
      - name: Куда публиковать
        id: target
        if: always() && env.SITE_REPO != ''
        run: |
          live=claude/team-dev-site-v3a
          if [[ "$GITHUB_REF_NAME" == *draft* ]] || { [ "$DRAFT" = true ] && [ "$GITHUB_REF_NAME" = "$live" ]; }; then t=draft
          elif [ "$DRAFT" != true ] && [ "$GITHUB_REF_NAME" = "$live" ]; then t=live
          else t=none; echo "ветка $GITHUB_REF_NAME — не $live и не черновик: на сайт не публикую"; fi
          echo "to=$t" >> "$GITHUB_OUTPUT"; echo "публикация: $t"
      - name: Взять сайт
        if: always() && env.SITE_REPO != '' && steps.target.outputs.to != 'none'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SITE_REPO }}
          token: ${{ secrets.SITE_TOKEN || github.token }}
          path: _site
          persist-credentials: false      # SITE_TOKEN не остаётся в _site/.git/config (как site.yml в main)
      - name: Обновить new/ на сайте
        if: always() && env.SITE_REPO != '' && steps.target.outputs.to != 'none'
        env:
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          TO: ${{ steps.target.outputs.to }}
        run: |
          [ -n "$SITE_TOKEN" ] || { echo "SITE_TOKEN не задан — new/ не обновлена"; exit 0; }
          # владелец 13.11: новый сайт — главный (в корне), для поиска пока закрыт (noindex). Включается сам, когда site.yml в main
          # умеет метку .v3a-root (не даёт старому сайту заменить главную); до этого — по-прежнему в new/
          if [ "$TO" = draft ]; then bash team/site/v3a/daily/publish_draft.sh team/site/v3a _site/draft; root=draft
          elif [ "$TO" != live ]; then echo "не публикую ($TO)"; exit 0
          else git fetch -q --depth=1 origin main && root=$(git show FETCH_HEAD:.github/workflows/site.yml | grep -c 'v3a-root' || true); fi
          if [ "$root" = draft ]; then :
          elif [ "${root:-0}" -gt 0 ]; then bash team/site/v3a/daily/publish_root.sh team/site/v3a _site
          else bash team/site/v3a/daily/publish_new.sh team/site/v3a _site/new; fi
          cd _site
          git config user.name "jarvis-site-bot"; git config user.email "jarvis-site-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "новый сайт не изменился"; exit 0; }
          git commit -q -m "$([ "$TO" = draft ] && echo 'Черновик сайта (draft/)' || echo 'Новый сайт'): обновление $(TZ=Europe/Moscow date '+%d.%m %H:%M') МСК"
          for i in 1 2 3 4 5; do
            # site.yml пишет в тот же репозиторий (другие папки) — подтянуть его коммиты и повторить
            # токен — только здесь: через заголовок для одной команды, на диск (_site/.git/config) не пишется
            git pull -q --rebase && git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SITE_TOKEN" | base64 -w0)" push -q && { echo "new/ обновлена"; exit 0; }
            git rebase --abort 2>/dev/null; sleep 15
          done
          exit 1
