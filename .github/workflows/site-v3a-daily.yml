# Ежедневное обновление данных макета сайта v3a (владелец 04.11): хоккей (сезон, таблицы, матчи, игроки), футбол (ESPN: матчи,
# таблицы, составы, тренды), линии (Фонбет / Pinnacle / приложение КХЛ / ESPN) и вероятности модели на ближайшие 2 дня.
# Код — team/site/v3a/daily/run.py (описание и формат ключей — daily/README.md); данные коммитятся в ту же ветку.
# Запуск: вручную, по изменению team/site/v3a/daily/run.txt и по расписанию — cron из main (site-v3a-daily-cron.yml, ветка
# claude/site-v3a-daily-cron): cron из не-главной ветки GitHub не запускает.
name: Данные v3a — ежедневное обновление

on:
  push:
    branches: ['claude/team-dev-**']
    paths: ['team/site/v3a/daily/run.txt']
  workflow_dispatch:
    inputs:
      publish_only:
        description: 'Только обновить папку new/ на сайте, без сбора данных (yes / no)'
        required: false
        default: 'no'

permissions:
  contents: write

concurrency:
  group: site-v3a-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_REPO: ${{ vars.SITE_REPO }}
      PUBLISH_ONLY: ${{ github.event.inputs.publish_only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: env.PUBLISH_ONLY != 'yes'
        with:
          python-version: '3.11'
      - run: pip install requests numpy brotli pillow
        if: env.PUBLISH_ONLY != 'yes'
      - name: Конвейер данных
        if: env.PUBLISH_ONLY != 'yes'
        run: python team/site/v3a/daily/run.py
      - name: Закоммитить данные
        if: always() && env.PUBLISH_ONLY != 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # страницы матчей и клубов (<лига>/…, seo/build_match.py) — тоже: без них новые матчи не появлялись (09.11)
          git add -A team/site/v3a/data team/site/v3a/assets/data team/site/v3a/team/season.json team/site/v3a/football/data team/site/v3a/hockey/data team/site/v3a/sitemap.xml team/site/v3a/robots.txt team/site/v3a/*.html team/site/v3a/hockey/*.html team/site/v3a/football/*.html team/site/v3a/team/index.html \
            team/site/v3a/khl team/site/v3a/nhl team/site/v3a/epl team/site/v3a/laliga team/site/v3a/seriea team/site/v3a/bundesliga team/site/v3a/ligue1 team/site/v3a/rpl team/site/v3a/ucl team/site/v3a/uel
          git diff --cached --quiet && { echo "данные не изменились"; exit 0; }
          git commit -q -m "Данные v3a: ежедневное обновление $(TZ=Europe/Moscow date '+%d.%m %H:%M') МСК (run ${{ github.run_number }})"
          git stash -q -u || true  # остатки конвейера вне git add мешали rebase (runs 6–10)
          for i in 1 2 3 4 5; do
            git fetch -q --depth=50 origin "$GITHUB_REF_NAME" && git rebase -q -X theirs FETCH_HEAD && git push && exit 0  # спор в файлах данных — берём свежесобранные (11.11)
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
      # Новый сайт рядом со старым (владелец 13.11): папка new/ в репозитории сайта обновляется сама после данных.
      # Трогаем только new/ — остальной сайт собирает site.yml. Нет SITE_REPO / SITE_TOKEN — шаг пропускается.
      - name: Взять сайт
        if: always() && env.SITE_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.SITE_REPO }}
          token: ${{ secrets.SITE_TOKEN || github.token }}
          path: _site
      - name: Обновить new/ на сайте
        if: always() && env.SITE_REPO != ''
        env:
          HAS_TOKEN: ${{ secrets.SITE_TOKEN != '' }}
        run: |
          [ "$HAS_TOKEN" = true ] || { echo "SITE_TOKEN не задан — new/ не обновлена"; exit 0; }
          bash team/site/v3a/daily/publish_new.sh team/site/v3a _site/new
          cd _site
          git config user.name "jarvis-site-bot"; git config user.email "jarvis-site-bot@users.noreply.github.com"
          git add -A new
          git diff --cached --quiet && { echo "new/ не изменилась"; exit 0; }
          git commit -q -m "Новый сайт (new/): обновление $(TZ=Europe/Moscow date '+%d.%m %H:%M') МСК"
          for i in 1 2 3 4 5; do
            # site.yml пишет в тот же репозиторий (другие папки) — подтянуть его коммиты и повторить
            git pull -q --rebase && git push -q && { echo "new/ обновлена"; exit 0; }
            git rebase --abort 2>/dev/null; sleep 15
          done
          exit 1
