# Статистика прогнозов канала @jarvibet по месяцам (team/site/months.py, владелец 23.10): только посты, которые владелец
# выложил и не удалил (лента t.me/s/jarvibet), итог — по счёту матча. Разовый запуск для сверки владельцем: из ветки
# claude/** записать в team/site/MONTHS_RUN дату начала (ГГГГ-ММ-ДД) и запушить; список — в логе, в артефакте «months» и
# коммитом в ту же ветку (team/site/months_out/), чтобы облачная сессия прочитала его без логов.
name: Статистика канала по месяцам

on:
  push:
    branches: ['claude/**']
    paths: ['team/site/MONTHS_RUN']
  workflow_dispatch:
    inputs:
      since:
        description: 'С какого дня считать (ГГГГ-ММ-ДД)'
        required: false
        default: '2026-09-01'

permissions:
  contents: write

jobs:
  months:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pillow>=11" numpy requests
      - name: Посчитать
        env:
          SINCE_IN: ${{ github.event.inputs.since }}
        run: |
          d="${SINCE_IN:-$(head -c 10 team/site/MONTHS_RUN 2>/dev/null)}"; d="${d:-2026-09-01}"
          [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "плохая дата: $d"; exit 1; }
          MONTHS_DUMP=1 python team/site/months.py "$d" out/months
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: months
          path: out/months/
          retention-days: 7
      - name: Сохранить в ветку
        if: github.event_name == 'push'
        run: |
          mkdir -p team/site/months_out && cp out/months/* team/site/months_out/
          git config user.name "jarvis-bot"; git config user.email "jarvis-bot@users.noreply.github.com"
          git add team/site/months_out && git commit -qm "Статистика канала по месяцам — результат запуска" && git push origin "HEAD:${GITHUB_REF_NAME}"
