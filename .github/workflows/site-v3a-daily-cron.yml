# Расписание для ежедневного обновления данных макета сайта v3a (владелец 04.11). Cron GitHub срабатывает только из главной
# ветки, поэтому здесь только запуск: код и данные — в ветке макета claude/team-dev-site-v3a (site-v3a-daily.yml, по образцу learn-weekly.yml).
name: Данные v3a — расписание

on:
  schedule:
    # GitHub запускает расписание с опозданием на 3–7 ч (09.11: утренний запуск 06:23 пришёл в 13:30, сегодняшний — не к 12:00),
    # поэтому утром четыре времени: хотя бы одно успевает. Репозиторий открытый — минуты Actions бесплатны.
    - cron: '7 1 * * *'      # 04:07 МСК
    - cron: '23 3 * * *'     # 06:23 МСК
    - cron: '41 6 * * *'     # 09:41 МСК
    # днём (владелец 11.11): метка и ссылка на пост у матча, итоги — прогнозы КХЛ выходят утром и днём, НХЛ — вечером
    - cron: '17 9 * * *'     # 12:17 МСК
    - cron: '17 12 * * *'    # 15:17 МСК
    - cron: '37 15 * * *'    # 18:37 МСК
    - cron: '47 20 * * *'    # 23:47 МСК
  workflow_dispatch:

permissions:
  actions: write

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site-v3a-daily.yml --repo "$GITHUB_REPOSITORY" --ref claude/team-dev-site-v3a
