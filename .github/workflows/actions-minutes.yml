# Расход минут GitHub Actions и прогноз до конца месяца (tools/actions_minutes.py, владелец 19.10):
# каждый день в 09:07 МСК; владельцу в Telegram — предупреждение, если прогноз > 1800 из 2000, по понедельникам — сводка.
name: Минуты GitHub — прогноз

on:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  minutes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python tools/actions_minutes.py
