# Постеры «Итоги дня», «Матчи дня» и общий пост КХЛ + НХЛ: таблица шлёт данные событием repository_dispatch «itogi» / «matchi» / «itogi2» / «players»;
# «sides» — баннеры «Бока» каждого матча дня в 4К вам в личку файлами;
# здесь картинка рисуется набором render/ и уходит в Telegram (render/itogi_job.py).
# Нужен секрет репозитория TG_BOT_TOKEN — токен того же бота, что и у таблиц.
name: Постеры «Итоги дня» и «Матчи дня»

on:
  repository_dispatch:
    types: [itogi, matchi, itogi2, players, sides]
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"league":"KHL","date_title":"среда, 30 сентября","chat":"<id>","items":[{"home":"…","away":"…","sh":1,"sa":0,"mark":""}]}'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event.action || 'manual' }}-${{ github.event.client_payload.league || 'manual' }}-${{ github.event.client_payload.day || github.run_id }}
  cancel-in-progress: false

jobs:
  poster:
    if: ${{ !contains(github.event.inputs.payload || '', '"kind":"avatar"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pillow>=11" numpy requests
      - name: Нарисовать и отправить
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TRACKS_KEY: ${{ secrets.TRACKS_KEY }}   # ключ треков владельца для роликов (render/reels/owner_tracks.py)
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
          EVENT_KIND: ${{ github.event.action }}
        run: python render/itogi_job.py

  # ИИ-ведущий (тест): payload {"kind":"avatar","branch":"tmp-avatar-…","size":256,"parts":[0,1,…,7]} — фото и голос
  # с временной ветки → куски говорящего видео параллельно (render/avatar_job.sh, матрица parts) → avatar_join склеивает,
  # кладёт артефакт на 1 день и шлёт владельцу в личку. Чужой код (SadTalker) — только в avatar, без секретов и прав на запись.
  avatar:
    if: ${{ contains(github.event.inputs.payload || '', '"kind":"avatar"') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # payload не avatar (ежедневные запуски таблицы) — задание пропускается, матрица не должна падать на fromJSON('')
        part: ${{ fromJSON(contains(github.event.inputs.payload || '', '"kind":"avatar"') && github.event.inputs.payload || '{"parts":[0]}').parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(github.event.inputs.payload).branch }}
          path: avatar_in
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Оживить фото под голос
        env:
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
          TB: ${{ github.workspace }}/avatar_in
          PART: ${{ matrix.part }}
          PARTS: ${{ strategy.job-total }}
        run: bash render/avatar_job.sh
      - uses: actions/upload-artifact@v4
        with:
          name: avatar-part-${{ matrix.part }}
          path: ${{ runner.temp }}/avatar/out/host.mp4
          retention-days: 1

  # отдельно, без перерисовки: payload {"kind":"avatar_join","branch":"tmp-avatar-…","run_id":<номер запуска с частями>}
  avatar_join:
    needs: avatar
    if: ${{ always() && (needs.avatar.result == 'success' || contains(github.event.inputs.payload || '', '"kind":"avatar_join"')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(github.event.inputs.payload).branch }}
          path: avatar_in
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
      - uses: actions/download-artifact@v4
        with:
          pattern: avatar-part-*
          path: parts
          run-id: ${{ fromJSON(github.event.inputs.payload).run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Склеить и отправить владельцу
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TB: ${{ github.workspace }}/avatar_in
        run: python render/avatar_join.py parts
      - uses: actions/upload-artifact@v4
        with:
          name: avatar-host
          path: avatar_host.mp4
          retention-days: 1
