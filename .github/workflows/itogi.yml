# Постеры «Итоги дня», «Матчи дня» и общий пост КХЛ + НХЛ: таблица шлёт данные событием repository_dispatch «itogi» / «matchi» / «itogi2» / «players»;
# «sides» — баннеры «Бока» каждого матча дня в 4К вам в личку файлами;
# здесь картинка рисуется набором render/ и уходит в Telegram (render/itogi_job.py).
# Нужен секрет репозитория TG_BOT_TOKEN — токен того же бота, что и у таблиц.
name: Постеры «Итоги дня» и «Матчи дня»

on:
  repository_dispatch:
    types: [itogi, matchi, itogi2, players, sides]
  workflow_dispatch:
    inputs:
      payload:
        description: 'JSON: {"league":"KHL","date_title":"среда, 30 сентября","chat":"<id>","items":[{"home":"…","away":"…","sh":1,"sa":0,"mark":""}]}'
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.event.action || 'manual' }}-${{ github.event.client_payload.league || 'manual' }}-${{ github.event.client_payload.day || github.run_id }}
  cancel-in-progress: false

jobs:
  poster:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install "pillow>=11" numpy requests anthropic librosa
      - name: Нарисовать и отправить
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TRACKS_KEY: ${{ secrets.TRACKS_KEY }}   # ключ треков владельца для роликов (render/reels/owner_tracks.py)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # тексты послематчевых разборов (team/postmatch, владелец 18.10)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # тексты послематчевых разборов, бесплатный ключ Google AI Studio (владелец 18.10)
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}           # загрузка на YouTube (team/reels_daily/youtube.py)
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}                   # Instagram Reels (team/reels_daily/instagram.py)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YANDEX_TTS_KEY: ${{ secrets.YANDEX_TTS_KEY }}         # озвучка шортсов, Yandex SpeechKit (владелец 20.10)
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
          INPUT_PAYLOAD: ${{ github.event.inputs.payload }}
          EVENT_KIND: ${{ github.event.action }}
        run: python render/itogi_job.py
      # каждый ролик сохраняется (владелец 17.10): полные версии — артефактом запуска на 90 дней
      - name: Сохранить ролики
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          path: |
            team/out/**/*.mp4
            render/out/**/*.mp4
          if-no-files-found: ignore
          retention-days: 90
