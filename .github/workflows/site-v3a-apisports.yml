# Фото футболистов из API-Football для сайта v3a (владелец 17.11): на ветках claude/team-dev-* при изменении
# team/site/v3a/football/as_run.txt (или вручную) запускает players_apisports.py: клубы и составы из API -> фото игрока ->
# лицо -> без фона -> 256x256 WEBP, и коммитит результат в ветку. Ключ — секрет APISPORTS_KEY. Дальше раз в день / неделю
# сбор продолжает ежедневная сборка (site-v3a-daily.yml, по дате football/data/as_next.txt).
name: Фото футболистов API-Football v3a

on:
  push:
    branches: ['claude/team-dev-**']
    paths: ['team/site/v3a/football/as_run.txt']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: site-v3a-daily
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-human-seg-v1
      - run: pip install "opencv-python-headless<5" rembg onnxruntime pillow requests
      - run: python team/site/v3a/football/players_apisports.py
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          AS_BUDGET: '2400'
      - name: Закоммитить фото
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team/site/v3a/football/data
          git diff --cached --quiet || git commit -m "Фото футболистов (API-Football) v3a: обработанные портреты"
          for i in 1 2 3 4 5; do
            git fetch -q --depth=50 origin "$GITHUB_REF_NAME" && git rebase -q FETCH_HEAD && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
      - name: Продолжить обработку фото, если лимит запросов не кончился (цепочка запусков)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(cat team/site/v3a/football/data/as_left.txt 2>/dev/null || echo 0)
          echo "осталось фото $left"
          if [ "$left" -gt 0 ]; then gh workflow run site-v3a-apisports.yml --ref "$GITHUB_REF_NAME"; fi
