# Фото футболистов с Transfermarkt для сайта v3a (владелец 17.11): на ветках claude/team-dev-* при изменении
# team/site/v3a/football/tm_run.txt запускает players_tm.py (Wikidata -> номер TM -> портрет -> лицо -> без фона -> 256x256 WEBP)
# и коммитит результат в ветку. Не успел за запуск — запускает себя снова, пока есть необработанные (tm_left.txt).
name: Фото футболистов Transfermarkt v3a

on:
  push:
    branches: ['claude/team-dev-**']
    paths: ['team/site/v3a/football/tm_run.txt']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: site-v3a-tm-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  tm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-human-seg-v1
      - run: pip install "opencv-python-headless<5" rembg onnxruntime pillow requests
      - name: Один opencv (headless), без конфликта пакетов
        run: |
          pip uninstall -y opencv-python opencv-contrib-python opencv-contrib-python-headless opencv-python-headless
          pip install "opencv-python-headless<5"
      - run: python team/site/v3a/football/players_tm.py
        env:
          TM_BUDGET: '2100'
      - name: Закоммитить фото
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A team/site/v3a/football/data
          git diff --cached --quiet || git commit -m "Фото футболистов (Transfermarkt) v3a: обработанные портреты"
          for i in 1 2 3 4 5; do
            git fetch -q --depth=50 origin "$GITHUB_REF_NAME" && git rebase -q FETCH_HEAD && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 10
          done
          exit 1
      - name: Продолжить, если обработаны не все (цепочка запусков)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          left=$(cat team/site/v3a/football/data/tm_left.txt 2>/dev/null || echo 0)
          echo "осталось $left"
          if [ "$left" -gt 0 ]; then gh workflow run site-v3a-tm.yml --ref "$GITHUB_REF_NAME"; fi
