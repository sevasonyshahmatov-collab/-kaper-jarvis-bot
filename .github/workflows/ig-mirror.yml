# Зеркало канала в Instagram (владелец 22.10): посты, вышедшие в Telegram, — постами-картинками в Instagram и черновик
# для YouTube владельцу в бота. Что делает — team/mirror/ig_mirror.py. Расписание работает из основной ветки.
name: Зеркало канала в Instagram

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ig-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - run: pip install -q "pillow>=11" requests
      - uses: actions/cache/restore@v4
        with:
          path: .ig_mirror
          key: ig-mirror-${{ github.run_id }}
          restore-keys: ig-mirror-
      - name: Выложить новые посты канала
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: python team/mirror/ig_mirror.py
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.ig_mirror/done.json') != ''
        with:
          path: .ig_mirror
          key: ig-mirror-${{ github.run_id }}
