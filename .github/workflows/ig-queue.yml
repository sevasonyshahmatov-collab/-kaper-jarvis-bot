# Очередь роликов в Instagram (владелец 26.10: не пачкой ночью, а по одному днём): ночной конвейер кладёт задания
# <ролик>.igq в артефакт, здесь выкладывается то, чему подошло время (team/reels_daily/ig_queue.py).
# Запускается после ночного конвейера, сам ждёт время роликов и перезапускает себя; тик соцсетей — запасной путь.
# Своим потоком — паузы между роликами (25 мин) не задерживают истории и карусель. Выключить очередь: переменная репозитория IG_QUEUE=0 (ролики сразу).
name: Instagram — очередь роликов

on:
  workflow_run:                   # запасной путь — тик соцсетей; основной — ночной конвейер и самоперезапуск
    workflows: ['Соцсети — тик', 'Шортсы — конвейер']
    types: [completed]
  schedule:                       # на случай, если тиков не было
    - cron: '35 7,10,13,16,19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write                  # скачать артефакты конвейера и запустить себя снова (остались задания)

concurrency:
  group: ig-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330           # запуск ждёт время роликов до 5 ч (ig_queue.RUN_FOR)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q requests            # ffmpeg ставит сам скрипт — только если ролик надо загружать заново
      - name: Выложить, чему подошло время
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python team/reels_daily/ig_queue.py
