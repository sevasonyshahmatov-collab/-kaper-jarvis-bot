# Разово (владелец 16.11): удалить ветки с копией истории сайта — из интерфейса GitHub удаление не прошло.
# Удаляет только две названные ветки. После запуска файл убрать.
name: Разово — удалить копии истории сайта

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  drop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Удалить ветки backup/site-history-*
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          for b in backup/site-history-20261103-0727 backup/site-history-20261105-0709; do
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$b"; then echo "удалена: $b"
            else echo "::error::не удалена: $b"; rc=1; fi
          done
          exit $rc
