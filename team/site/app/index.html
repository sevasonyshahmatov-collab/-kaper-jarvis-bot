<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JARVIS — прогнозы на хоккей</title>
<meta name="robots" content="noindex">
<!-- Мини-приложение Telegram, прототип (владелец 25.10). Экраны и переходы рабочие, данные — примеры (DATA ниже).
     Внутри Telegram: системная кнопка «Назад», цвета шапки, раскрытие на весь экран; в браузере — своя шапка. -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#0e1116;--card:#181c24;--card2:#20252f;--line:#2a303c;--fg:#f2f4f8;--mute:#9aa3b2;--acc:#3ee0ff;--gold:#ffc93c;--win:#2fbf71;--loss:#e5484d;--tg:#2aa8ff;
  --vh:var(--tg-viewport-stable-height,100dvh)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.35 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{height:var(--vh);display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;min-height:52px}
.bar b{font:700 16px Inter,sans-serif}
.bar .back{color:var(--acc);font-weight:600;min-height:44px;min-width:44px;display:flex;align-items:center}
.in-tg .bar{display:none}
.scr{flex:1;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.scr>*{flex-shrink:0}
.main{flex:1 0 auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.main>*{flex-shrink:0}
.grow{flex:1 0 auto;display:flex;flex-direction:column}.grow>.fill{flex:1 0 auto}
.card{background:var(--card);border-radius:14px;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;display:flex;align-items:center;background:var(--card);color:var(--mute);font:600 14px Inter,sans-serif}
.chip.on{background:var(--fg);color:#0e1116}
.gh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font:700 14px Inter,sans-serif}
.gh small{margin-left:auto;font:500 13px Inter,sans-serif;color:var(--mute)}
.badge{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;font:700 13px Inter,sans-serif;white-space:nowrap;background:rgba(255,201,60,.14);color:var(--gold)}
.lg{flex:none;width:30px;height:30px;object-fit:contain}
.btn{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;font:700 15px Inter,sans-serif;width:100%}
.btn.tg{background:var(--tg);color:#fff}.btn.gold{background:var(--gold);color:#1d1500}.btn.sec{background:var(--card2)}
.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(10px + env(safe-area-inset-bottom))}
.nav button{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mute);font:600 11px Inter,sans-serif}
.nav svg{width:24px;height:24px}.nav button.on{color:var(--nav,var(--acc))}
.ex{font:500 12px Inter,sans-serif;color:var(--mute);text-align:center}
/* матчи */
.feat{display:block;padding:14px;background:linear-gradient(135deg,var(--h1) 0%,#181c24 45%,#181c24 55%,var(--h2) 100%)}
.feat .hd{display:flex;justify-content:space-between;align-items:center;font:600 13px Inter,sans-serif;color:var(--mute)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:8px 0 10px}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:8px;font:700 15px Inter,sans-serif;text-align:center}
.vs .t img{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(255,255,255,.16)) drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.vs .c{text-align:center}.vs .c b{display:block;font:800 26px Inter,sans-serif}.vs .c small{color:var(--mute);font-size:12px}
.feat .ft{display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.feat .ft p{margin:0;font:600 14px Inter,sans-serif}.feat .ft small{display:block;color:var(--mute);font-weight:500;font-size:12px}
.mr{display:grid;grid-template-columns:minmax(0,1fr) auto 50px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);min-height:58px;width:100%;text-align:left}
.mr:last-child{border-bottom:0}
.tt{display:flex;flex-direction:column;gap:4px}.tt span{display:flex;align-items:center;gap:10px;font:600 15px Inter,sans-serif}
.mr time{font:600 14px Inter,sans-serif;color:var(--mute);text-align:right}
/* матч */
.mh{padding:4px 16px 0;background:linear-gradient(180deg,var(--h1) 0%,#0e1116 100%)}
.mh .vs .t img{width:76px;height:76px}
.mh .vs .c b{font-size:30px}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;padding:12px 0;font:600 14px Inter,sans-serif;color:var(--mute)}
.tabs button.on{color:var(--fg);box-shadow:inset 0 -3px 0 var(--tab,var(--acc))}
.pc{padding:14px}.pc .l{font:600 13px Inter,sans-serif;color:var(--mute)}
.pc .r{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.pc .r b{font:800 22px Inter,sans-serif}.pc .r .k{font:800 28px Inter,sans-serif;color:var(--gold)}
.pc .s{color:var(--mute);font-size:13px;margin-top:2px}
.odds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.odds div{background:var(--card2);border-radius:10px;padding:8px 0;text-align:center}.odds small{display:block;color:var(--mute);font-size:12px}.odds b{font:700 17px Inter,sans-serif}
.odds .on{background:rgba(255,201,60,.14);box-shadow:inset 0 0 0 1.5px var(--gold)}.odds .on b{color:var(--gold)}
.fl{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:#d5dae3}
.fr{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.fr:last-child{border-bottom:0}.fr span{font:600 15px Inter,sans-serif}
.wl{display:flex;gap:4px}.wl i{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font:700 12px Inter,sans-serif;font-style:normal;color:#fff;background:var(--win)}.wl i.l{background:var(--loss)}
.h2h{display:flex;align-items:center;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);min-height:46px}.h2h:last-child{border-bottom:0}
.h2h span{color:var(--mute);font:500 13px Inter,sans-serif;width:64px}.h2h b{font:600 14px Inter,sans-serif}.h2h em{margin-left:auto;font:600 12px Inter,sans-serif;color:var(--mute);font-style:normal}
.acts{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
/* итоги */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sum div{background:var(--card);border-radius:12px;padding:12px 14px}.sum b{font:800 22px Inter,sans-serif}.sum small{display:block;color:var(--mute);font-size:13px}
.rr{display:grid;grid-template-columns:30px minmax(0,1fr) auto 26px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);min-height:60px;width:100%;text-align:left}
.rr:last-child{border-bottom:0}
.rr .m{font:600 14px Inter,sans-serif}.rr .m small{display:block;color:var(--mute);font-weight:500;font-size:13px}.rr .s{font:700 15px Inter,sans-serif}
.res{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font:800 13px Inter,sans-serif;color:#fff;background:var(--win)}.res.l{background:var(--loss)}
/* таблица */
.th,.tr{display:grid;grid-template-columns:22px 30px minmax(0,1fr) 36px 52px;gap:10px;align-items:center;padding:0 14px;width:100%;text-align:left}
.th{min-height:38px;border-bottom:1px solid var(--line);font:600 12px Inter,sans-serif;color:var(--mute)}
.tr{min-height:52px;border-bottom:1px solid var(--line)}
.tr .n{font:600 14px Inter,sans-serif;color:var(--mute)}.tr.top .n{color:var(--acc)}
.tr .t{font:600 15px Inter,sans-serif}.tr .g{text-align:right;color:var(--mute);font:500 14px Inter,sans-serif}.tr .e{text-align:right;font:700 15px Inter,sans-serif}
.lock{position:relative;overflow:hidden}.lock .rows{filter:blur(5px);opacity:.6}
.lock .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(180deg,rgba(24,28,36,.2),rgba(24,28,36,.9))}
.lock .ov b{font:700 16px Inter,sans-serif}.lock .ov span{color:var(--mute);font-size:13px}
/* команда */
.th3{position:relative;overflow:hidden;padding:12px 16px 16px;background:linear-gradient(125deg,var(--p) 0%,var(--p) 52%,var(--s) 52.2%,var(--s) 100%)}
.th3::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.55))}
.th3 .wm{position:absolute;right:-50px;top:-10px;width:230px;height:230px;object-fit:contain;opacity:.16;transform:rotate(-8deg)}
.th3>*{position:relative}
.th3 .row1{display:flex;align-items:center;gap:14px}
.th3 .em{width:74px;height:74px;object-fit:contain;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.th3 h1{margin:0;font:800 26px Inter,sans-serif;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.th3 .sub{color:rgba(255,255,255,.82);font-size:13px;margin-top:2px}
.pills{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pills span{background:rgba(0,0,0,.35);border-radius:999px;padding:7px 12px;font:600 13px Inter,sans-serif;color:#fff}.pills b{font-weight:800}
.rad{flex:1;display:flex;align-items:center;justify-content:center;padding:0 0 4px}.rad svg{width:100%;max-height:min(440px,calc(var(--vh) - 400px));min-height:230px}
.legend{display:flex;justify-content:center;gap:18px;font:500 12px Inter,sans-serif;color:var(--mute);padding:0 0 12px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid var(--tab);vertical-align:middle;margin-right:6px}.legend i.d{border-top:2px dashed rgba(255,255,255,.55)}
.pl{display:grid;grid-template-columns:minmax(0,1fr) 34px 54px 40px;gap:8px;align-items:center;padding:0 14px;min-height:46px;border-bottom:1px solid var(--line);font:500 14px Inter,sans-serif}
.pl:last-child{border-bottom:0}.pl span:not(:first-child){text-align:right}.pl b{font-weight:700}.pl small{display:block;color:var(--mute);font-size:12px}
.pl.h{min-height:34px;font:600 12px Inter,sans-serif;color:var(--mute)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--mute)}
.empty b{color:var(--fg);font:700 18px Inter,sans-serif}
.cmp{display:grid;grid-template-columns:28px 1fr 96px 1fr 28px;gap:8px;align-items:center;padding:0 14px;min-height:34px}
.cmp b{font:800 14px Inter,sans-serif;text-align:center}
.cmp .cb{height:8px;border-radius:4px;background:rgba(255,255,255,.06);display:flex;overflow:hidden}
.cmp .cb.l{justify-content:flex-end}.cmp .cb i{display:block;height:100%;border-radius:4px}
.cmp .lbl{text-align:center;font:600 12px Inter,sans-serif;color:var(--mute)}
.cmp:last-child{padding-bottom:8px}
.promo{padding:14px;display:flex;flex-direction:column;gap:8px}.promo b{font:700 16px Inter,sans-serif}.promo span{color:var(--mute);font-size:13px}
.res.p{background:#5b6475}
.l10{font:600 13px Inter,sans-serif;color:var(--mute)}
.th3 .wm{display:block}
span.lg{display:inline-block}
/* фон команды: рисунок-маска (bg/<эмблема>.svg, team/site/app_data/bg_art.py) в цвете клуба */
.art{position:absolute;inset:0;background:var(--artc,#fff);-webkit-mask:var(--art) right bottom/cover no-repeat;mask:var(--art) right bottom/cover no-repeat;opacity:.38;pointer-events:none}
.th3 .art{opacity:.42}
.pagebg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.pagebg .art{opacity:.16}
.photo{position:absolute;inset:0;background:linear-gradient(90deg,var(--pc) 0%,var(--pc) 22%,transparent 72%),var(--ph) center/cover no-repeat;pointer-events:none}
.th3 .photo~.wm{display:none}
.pagebg .photo{opacity:.22;filter:blur(2px)}
/* сравнение */
.vsbtn{margin:0 14px 12px;width:calc(100% - 28px)}
.cmpt{display:grid;grid-template-columns:minmax(0,1fr) 64px 64px;gap:8px;align-items:center;padding:8px 14px;border-top:1px solid rgba(255,255,255,.06);font:500 13px Inter,sans-serif}
.cmpt b{text-align:right;font:800 15px Inter,sans-serif}.cmpt small{display:block;color:var(--mute);font-size:11px;font-weight:500;text-align:right}
.cmpt.h{font:600 12px Inter,sans-serif;color:var(--mute)}
.cmpt.h span{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.pick-t{display:grid;grid-template-columns:22px 30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:0 14px;min-height:52px;border-bottom:1px solid var(--line)}
.pick-t .n{color:var(--mute);font:600 13px Inter,sans-serif}.pick-t .t{font:600 15px Inter,sans-serif}.pick-t small{color:var(--mute);font-size:12px}
.sidelogo{display:none}
/* ── компьютер: меню слева, содержимое в колонках */
@media (min-width:900px){
 html:not(.in-tg) body{background:#0b0e13}
 html:not(.in-tg) .app{flex-direction:row;max-width:1680px;height:100vh;gap:0}
 html:not(.in-tg) .bar{display:none}
 html:not(.in-tg) .nav{order:-1;display:flex;flex-direction:column;justify-content:flex-start;gap:4px;width:220px;flex:none;border-top:0;border-right:1px solid var(--line);padding:20px 12px;background:rgba(24,28,36,.6)}
 html:not(.in-tg) .nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;min-height:46px;border-radius:12px;font:600 15px Inter,sans-serif}
 html:not(.in-tg) .nav button.on{background:rgba(255,255,255,.06)}
 html:not(.in-tg) .sidelogo{display:block;font:800 22px Inter,sans-serif;letter-spacing:.04em;padding:4px 14px 18px}
 html:not(.in-tg) .sidelogo i{font-style:normal;color:var(--acc)}
 html:not(.in-tg) .main{padding:20px 28px 28px}
 .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
 .cols>section{display:flex;flex-direction:column;gap:12px}
 .cols3{grid-template-columns:repeat(3,minmax(0,1fr))}
 .th3{padding:28px 36px 30px;min-height:260px}
 .th3 .em{width:120px;height:120px}
 .th3 h1{font-size:42px}
 .th3 .wm{width:360px;height:360px;right:6%;top:-40px}
 .tabs{padding:0 36px}
 .teamgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
 .teamgrid .rad svg{max-height:560px;min-height:420px}
 .mh{padding:24px 36px 8px}.mh .vs .t img{width:110px;height:110px}.mh .vs .c b{font-size:40px}
 .feat .vs .t img{width:78px;height:78px}
 .cmpt{grid-template-columns:minmax(0,1fr) 150px 150px;padding:10px 18px;font-size:14px}
 .cmpt b{font-size:18px}.cmpt small{font-size:12px}
}

.note{font-size:12px;color:var(--mute);padding:0 14px 12px}
/* тренды команд (team/site/app_data/trends.py, владелец 26.10) */
.tb{display:grid;grid-template-columns:18px 26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;font:600 14px Inter,sans-serif}
.tb:last-child{border-bottom:0}.tb .n{color:var(--mute);font-size:12px}.tb b{font-weight:800;white-space:nowrap}.tb:first-of-type b{color:var(--gold)}
.tseg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}.tseg .chip{flex:none}
.trg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.trg div{background:var(--card2);border-radius:10px;padding:9px 11px}.trg small{display:block;color:var(--mute);font-size:11px}.trg b{font:800 17px Inter,sans-serif}.trg b span{font:500 12px Inter,sans-serif;color:var(--mute);margin-left:4px}

</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar"><button class="back" id="back" hidden>Назад</button><b>JARVIS</b><span style="width:44px"></span></div>
  <div class="scr" id="scr"></div>
  <nav class="nav" id="nav" aria-label="Разделы"></nav>
</div>
<div class="pagebg" id="pagebg" aria-hidden="true"></div>
<script>
'use strict';
// Данные — <сайт>/app/data.json (team/site/build.py → app_data, команды — team/site/app_data/build.py), обновляются вместе
// с сайтом (03:23 и 10:23 МСК). Нет файла (превью, локально) — показываем пример SAMPLE того же формата с пометкой.
const CHANNEL='https://t.me/jarvibet';
const SAMPLE={sample:1,axes:['Атака','Защита','Вратари','Большинство','Меньшинство','Форма'],built:'',
 leagues:{khl:[
  {name:'Ак Барс',conf:'Восток',place:3,gp:20,pts:26,w:12,l:8,gf:60,ga:48,form:'ВВПВВ',l10:14,coach:'',slug:'akbars',colors:['#007a48','#e30613','#28aa46'],axes:[82,74,88,61,79,90],
   players:[{n:'Нападающий 1',pos:'нап.',gp:20,g:9,a:10,pts:19},{n:'Нападающий 2',pos:'нап.',gp:20,g:7,a:9,pts:16},{n:'Защитник 1',pos:'защ.',gp:20,g:3,a:11,pts:14}],
   goalies:[{n:'Вратарь 1',gp:14,w:9,sv:92.5,gaa:2.05,so:1}]},
  {name:'Нефтехимик',conf:'Восток',place:2,gp:19,pts:24,w:11,l:8,gf:55,ga:46,form:'ПВПВВ',l10:11,slug:'neftekhimik',colors:['#1c3f6e','#c82832','#285aa0'],axes:[74,57,87,66,64,51],players:[],goalies:[]}]},
 games:[{lg:'khl',d:'2026-10-25 19:30',h:'Ак Барс',a:'Нефтехимик',pick:'Победа Ак Барса в осн. время',k:'1,85',x:[1.85,4.2,3.9],p:.58,u:'#'}],
 schedule:[{lg:'khl',d:'2026-10-25 19:30',h:'Ак Барс',a:'Нефтехимик'}],
 results:[{lg:'khl',d:'2026-10-24 19:30',h:'Ак Барс',a:'Нефтехимик',pick:'Победа Ак Барса',k:'1,85',sc:'3:1',r:'win'}],
 logos:{'Ак Барс':'app/emb/akbars.webp','Нефтехимик':'app/emb/neftekhimik.webp'}};
const BG=new Set(['nhl_col','sibir','admiral','metallurg','lokomotiv','cska']);   // фоны-рисунки (маска) — bg_art.py
let PHOTO=new Set();                                     // фоны-картинки от Gemini — bg/photos.json (bg_ai.py)
const art=(t,col,page)=>{if(!t||!t.slug)return '';
 if(PHOTO.has(t.slug))return `<div class="photo${page?' pg':''}" style="--ph:url('bg/${t.slug}.webp');--pc:${hexA((t.colors||[])[0],page?.55:.82)}"></div>`;
 return BG.has(t.slug)?`<div class="art" style="--art:url('bg/${t.slug}.svg');--artc:${col}"></div>`:''};
const WIDE=()=>!tg&&matchMedia('(min-width:900px)').matches;
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
let DB=null,LG='khl';
const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.platform&&Telegram.WebApp.platform!=='unknown'?Telegram.WebApp:null;
const $=s=>document.querySelector(s),scr=$('#scr');
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const T=name=>{for(const k in DB.leagues||{}){const r=(DB.leagues[k]||[]).find(x=>x.name===name);if(r)return Object.assign({lg:k},r)}return null};
const logo=name=>{const p=(DB.logos||{})[name];if(p)return '../'+p;const t=T(name);return t&&t.slug?'emb/'+t.slug+'.webp':''};
const img=(name,cls)=>{const s=logo(name);return s?`<img class="${cls||'lg'}" src="${esc(s)}" alt="">`:`<span class="${cls||'lg'}"></span>`};
const href=name=>'#team/'+encodeURIComponent(name);
const hexA=(h,a)=>{const n=parseInt(String(h||'#333333').slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`};
function bright(h){ // тёмный фирменный цвет на тёмном фоне не виден — осветляем акцент
 const n=parseInt(String(h||'#3ee0ff').slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const l=(.2126*r+.7152*g+.0722*b)/255;
 if(l<.42){const k=(.42-l)/.42*.8+.2;r=Math.round(r+(255-r)*k);g=Math.round(g+(255-g)*k);b=Math.round(b+(255-b)*k)}return `rgb(${r},${g},${b})`}
const dayLabel=iso=>{const d=new Date(iso+'T12:00:00');return d.getDate()+' '+MON[d.getMonth()]};
const kef=v=>v==null?'—':(+v).toFixed(2).replace('.',',');
function openLink(u){if(!u||u==='#')return;if(/^https:\/\/t\.me\//.test(u)){tg?tg.openTelegramLink(u):window.open(u,'_blank','noopener')}else{tg?tg.openLink(new URL(u,location.href).href):window.open(u,'_blank','noopener')}}
const haptic=()=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.selectionChanged()}catch(e){}};
const note=()=>DB.sample?'<div class="ex">Пример данных — настоящие появятся после сборки сайта</div>':`<div class="ex">Обновлено ${esc(DB.built||DB.updated||'')}, данные КХЛ и НХЛ</div>`;

// ── Матчи дня: самый уверенный прогноз — карточкой, расписание дня — списком (метка «прогноз» у матчей с прогнозом)
function matches(lg){
 if(WIDE())return `<div class="main"><div class="cols">${['khl','nhl'].map(l=>`<section><div class="gh" style="border:0;padding:4px 2px;font-size:18px">${l==='khl'?'КХЛ':'НХЛ'}</div>${matchBlock(l)}</section>`).join('')}</div>
  <button class="btn tg" data-link="${CHANNEL}" style="max-width:420px">Все прогнозы в канале @jarvibet</button>${note()}</div>`;
 return `<div class="main" style="padding-top:8px">${lgChips(lg,'matches')}${matchBlock(lg)}<button class="btn tg" data-link="${CHANNEL}">Все прогнозы в канале @jarvibet</button>${note()}</div>`;
}
function matchBlock(lg){
 const games=(DB.games||[]).filter(g=>g.lg===lg),sched=(DB.schedule||[]).filter(g=>g.lg===lg);
 const byPair={};games.forEach((g,i)=>byPair[g.h+'|'+g.a]=g);
 const f=games.slice().sort((a,b)=>b.p-a.p)[0];
 const list=(sched.length?sched:games).filter(x=>!f||x.h!==f.h||x.a!==f.a);
 const day=(f||list[0]||{}).d;
 let h='';
 if(f){const th=T(f.h)||{},ta=T(f.a)||{};
  h+=`<a class="card feat" href="#match/${encodeURIComponent(f.h+'|'+f.a)}" style="--h1:${hexA((th.colors||[])[0],.45)};--h2:${hexA((ta.colors||[])[0],.55)}">
  <div class="hd"><span>Матч дня · ${lg==='khl'?'КХЛ':'НХЛ'}</span><span class="badge">Кэф ${esc(f.k)}</span></div>
  <div class="vs"><div class="t">${img(f.h,'')}${esc(f.h)}</div><div class="c"><b>${f.d.slice(11,16)}</b><small>${dayLabel(f.d.slice(0,10))}</small></div><div class="t">${img(f.a,'')}${esc(f.a)}</div></div>
  <div class="ft"><p>${esc(f.pick)}<small>прогноз JARVIS</small></p><span style="color:var(--acc);font:600 14px Inter,sans-serif">Разбор матча</span></div></a>`}
 if(list.length){h+=`<div class="card grow"><div class="gh">${lg==='khl'?'КХЛ':'НХЛ'}${day?' · '+dayLabel(day.slice(0,10)):''}<small>${list.length} ${list.length===1?'матч':list.length<5?'матча':'матчей'}</small></div>`+
  list.map(x=>{const g=byPair[x.h+'|'+x.a];return `<${g?`a href="#match/${encodeURIComponent(x.h+'|'+x.a)}"`:'div'} class="mr fill"><div class="tt"><span>${img(x.h)}${esc(x.h)}</span><span>${img(x.a)}${esc(x.a)}</span></div>${g?`<span class="badge">${esc(pickBadge(g.pick))}</span>`:'<span></span>'}<time>${x.d.slice(11,16)}</time></${g?'a':'div'}>`}).join('')+'</div>'}
 if(!f&&!list.length)h+=`<div class="card grow"><div class="empty"><b>Сегодня матчей нет</b><span>Расписание и прогнозы появятся утром в день игр.</span></div></div>`;
 return h;
}

// ── Разбор матча: прогноз, линия, сравнение команд по шестиугольнику, форма
function match(key){
 const g=(DB.games||[]).find(x=>x.h+'|'+x.a===key);if(!g)return matches(LG);
 const th=T(g.h)||{},ta=T(g.a)||{},ax=DB.axes||[];
 const odds=g.x&&g.x.length===3?`<div class="odds">${['П1','Ничья','П2'].map((l,i)=>`<div><small>${l}</small><b>${kef(g.x[i])}</b></div>`).join('')}</div>`:'';
 const cb=bright((ta.colors||[])[2]),ca0=bright((th.colors||[])[2]),ca=ca0===cb?'#ffffff':ca0;
 const cmp=(th.axes&&ta.axes)?`<div class="card"><div class="gh">Сравнение команд<small>место в лиге, 0–100</small></div><div class="rad">${radar([{v:th.axes,c:ca,name:g.h},{v:ta.axes,c:cb,name:g.a}],ax)}</div>
  <div class="legend"><span><i style="border-color:${ca}"></i>${esc(g.h)}</span><span><i style="border-color:${cb};border-top-style:dashed"></i>${esc(g.a)}</span></div>${cmpTable(Object.assign({},th,{name:g.h}),Object.assign({},ta,{name:g.a}),ca,cb)}</div>`:'';
 const frm=t=>t.form?[...t.form].map(c=>`<i class="${c==='П'?'l':''}">${c}</i>`).join(''):(t.l10s?`<span class="l10">${esc(t.l10s)} за 10</span>`:'');
 const head=`<div class="mh" style="--h1:${hexA((th.colors||[])[0],.35)}">
  <div class="vs" style="padding:8px 0 14px;margin:0"><a class="t" href="${href(g.h)}">${img(g.h,'')}${esc(g.h)}</a><div class="c"><b>${g.d.slice(11,16)}</b><small>${dayLabel(g.d.slice(0,10))}, МСК</small></div><a class="t" href="${href(g.a)}">${img(g.a,'')}${esc(g.a)}</a></div></div>`;
 const trs=trCard(th,'Тренды: '+esc(g.h))+trCard(ta,'Тренды: '+esc(g.a));
 const left=`<div class="card pc"><div class="l">Прогноз JARVIS</div><div class="r"><b>${esc(g.pick)}</b><span class="k">${esc(g.k)}</span></div>${odds}</div>
 <div class="card"><div class="gh">Форма${th.form?', последние 5':''}</div>${[[g.h,th],[g.a,ta]].map(([n,t])=>`<a class="fr" href="${href(n)}">${img(n)}<span>${esc(n)}</span><div class="wl">${frm(t)}</div></a>`).join('')}</div>
 <div class="acts"><button class="btn sec" data-link="${esc(g.u)}">Полный разбор на сайте</button><button class="btn tg" data-link="${CHANNEL}">Канал @jarvibet</button></div>`;
 return `${head}<div class="main" style="padding-top:12px">${WIDE()?`<div class="cols"><section>${left}${trs}</section><section>${cmp}</section></div>`:left.replace('<div class="acts">',cmp+trs+'<div class="acts">')}${note()}</div>`;
}

// ── Итоги прогнозов по дням (все, и зашедшие, и нет)
function results(){
 const rs=DB.results||[],by={};rs.forEach(r=>(by[r.d.slice(0,10)]=by[r.d.slice(0,10)]||[]).push(r));
 const days=Object.keys(by).sort().reverse().slice(0,7);
 let h='<div class="main" style="padding-top:8px">'+(WIDE()?'<div class="cols cols3">':'');
 if(!days.length)h+=`<div class="card grow"><div class="empty"><b>Итогов пока нет</b><span>Здесь появятся прогнозы после сыгранных матчей.</span></div></div>`;
 days.forEach((d,i)=>{const dt=new Date(d+'T12:00:00');h+=`<div class="card${i===days.length-1?' grow':''}"><div class="gh">${WD[dt.getDay()]}, ${dayLabel(d)}</div>${by[d].map(r=>
  `<button class="rr fill" data-link="${CHANNEL}">${img(r.h)}<div class="m">${esc(r.h)} — ${esc(r.a)}<small>${esc(r.pick)} · ${esc(r.k)}</small></div><span class="s">${esc(r.sc||'')}</span><span class="res ${r.r==='win'?'':r.r==='push'?'p':'l'}" aria-label="${r.r==='win'?'зашёл':r.r==='push'?'возврат':'не зашёл'}">${r.r==='win'?'✓':r.r==='push'?'↩':'✕'}</span></button>`).join('')}</div>`});
 return h+(WIDE()?'</div>':'')+note()+'</div>';
}

// ── Турнирная таблица по конференциям (нажатие — страница команды) + промо «Таблицы JARVIS»
function table(lg){
 const rows=(DB.leagues||{})[lg]||[],confs=[...new Set(rows.map(r=>r.conf))].filter(Boolean).sort((a,b)=>a==='Запад'?-1:1);
 let h=`<div class="main" style="padding-top:8px">${lgChips(lg,'table')}${WIDE()?'<div class="cols">':''}`;
 confs.forEach((c,ci)=>{const rs=rows.filter(r=>r.conf===c).sort((a,b)=>a.place-b.place);
  h+=`<div class="card"><div class="gh">${esc(c)}<small>И · О</small></div>${rs.map(r=>`<a class="tr${r.place<=8?' top':''}" href="${href(r.name)}"><span class="n">${r.place}</span>${img(r.name)}<span class="t">${esc(r.name)}</span><span class="g">${r.gp}</span><span class="e">${r.pts}</span></a>`).join('')}</div>`});
 if(WIDE())h+='</div>';
 if(!confs.length)h+=`<div class="card grow"><div class="empty"><b>Таблица появится после сборки</b></div></div>`;
 return h+`<div class="card promo"><b>Таблица JARVIS</b><span>Рейтинг Эло, что чаще всего заходит у каждой команды и история прогнозов — для подписчиков.</span><button class="btn gold" data-act="buy">Узнать про доступ</button></div>${note()}</div>`;
}
// ── Тренды команд: доска лидеров по выбранному тренду (поле tr у команд — team/site/app_data/trends.py)
const pc=(k,n)=>n?Math.round(100*k/n)+'%':'—';
const plr=(n,a,b,c)=>{n=Math.abs(n);const m=n%10,h=n%100;return n+' '+(m===1&&h!==11?a:m>=2&&m<=4&&(h<12||h>14)?b:c)};
const TR=[
 ['o55','Тотал больше 5,5',t=>t.o['5.5']/t.n,t=>`${t.o['5.5']} из ${t.n}`],
 ['u55','Тотал меньше 5,5',t=>1-t.o['5.5']/t.n,t=>`${t.n-t.o['5.5']} из ${t.n}`],
 ['o45','Тотал больше 4,5',t=>t.o['4.5']/t.n,t=>`${t.o['4.5']} из ${t.n}`],
 ['o65','Тотал больше 6,5',t=>t.o['6.5']/t.n,t=>`${t.o['6.5']} из ${t.n}`],
 ['btts','Обе забьют',t=>t.btts/t.n,t=>`${t.btts} из ${t.n}`],
 ['ot','Овертаймы',t=>t.ot/t.n,t=>`${t.ot} из ${t.n}`],
 ['ws','Серия побед',t=>t.sn,t=>plr(t.sn,'победа','победы','побед')],
 ['ls','Серия поражений',t=>-t.sn,t=>plr(t.sn,'поражение','поражения','поражений')],
 ['home','Дома',t=>t.home[0]/Math.max(1,t.home[0]+t.home[1]),t=>`${t.home[0]}–${t.home[1]}`],
 ['away','В гостях',t=>t.away[0]/Math.max(1,t.away[0]+t.away[1]),t=>`${t.away[0]}–${t.away[1]}`]];
function trends(lg,k){
 const tr=TR.find(x=>x[0]===k)||TR[0];
 const rows=((DB.leagues||{})[lg]||[]).filter(r=>r.tr&&r.tr.n>=3).sort((a,b)=>tr[2](b.tr)-tr[2](a.tr));
 const seg=`<div class="tseg">${TR.map(x=>`<button class="chip${x[0]===tr[0]?' on':''}" data-go="trends/${lg}/${x[0]}">${x[1]}</button>`).join('')}</div>`;
 const list=rows.length?`<div class="card grow"><div class="gh">${tr[1]}<small>${lg==='khl'?'КХЛ':'НХЛ'} · сезон</small></div>${rows.map((r,i)=>`<a class="tb" href="${href(r.name)}"><span class="n">${i+1}</span>${img(r.name)}<span>${esc(r.name)}</span><b>${tr[3](r.tr)}</b></a>`).join('')}</div>`
  :`<div class="card grow"><div class="empty"><b>Тренды появятся после обновления данных</b></div></div>`;
 return `<div class="main" style="padding-top:8px">${lgChips(lg,'trends')}${seg}${list}<button class="btn sec" data-link="../trendy/">Все тренды таблицей на сайте</button>${note()}</div>`;
}
// карточка трендов команды — на её странице и в разборе матча
const trCard=(t,title)=>{const x=t&&t.tr;if(!x)return '';
 const c=(l,v,s)=>`<div><small>${l}</small><b>${v}${s?`<span>${s}</span>`:''}</b></div>`;
 return `<div class="card"><div class="gh">${title||'Тренды сезона'}<small>${plr(x.n,'матч','матча','матчей')}</small></div><div class="trg">
  ${c('Тотал больше 5,5',pc(x.o['5.5'],x.n),x.o['5.5']+' из '+x.n)}${c('Средний тотал',String(x.tot.toFixed(1)).replace('.',','))}
  ${c('Обе забьют',pc(x.btts,x.n),x.btts+' из '+x.n)}${c('Овертаймы',pc(x.ot,x.n),x.ot+' из '+x.n)}
  ${c('Серия',x.sn>0?plr(x.sn,'победа','победы','побед'):plr(x.sn,'поражение','поражения','поражений'))}${c('Последние 10: ТБ 5,5',x.o10[0]+' из '+x.o10[1])}
  ${c('Дома',x.home[0]+'–'+x.home[1])}${c('В гостях',x.away[0]+'–'+x.away[1])}</div></div>`};
function video(){
 return `<div class="main" style="padding-top:8px"><div class="card grow"><div class="empty"><b>Ролики появятся здесь</b><span>Короткие прогнозы на матчи дня — те же, что на YouTube и в Instagram.</span></div></div>
  <button class="btn tg" data-link="${CHANNEL}">Смотреть в канале @jarvibet</button></div>`;
}
function radar(series,ax){ // series: [{v:[6], c:цвет, name}] — первая команда сверху, остальные наложены
 const W=366,H=420,r=142,c=W/2,cy=H/2+4,pt=(i,x)=>[c+r*x/100*Math.sin(Math.PI*i/3),cy-r*x/100*Math.cos(Math.PI*i/3)];
 const poly=vs=>vs.map((x,i)=>pt(i,x==null?0:x).map(n=>n.toFixed(1)).join(',')).join(' ');
 const one=series.length===1,a0=series[0].c;
 let o=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${series.map(s=>s.name+': '+ax.map((a,i)=>a+' '+(s.v[i]??'нет данных')).join(', ')).join('; ')}"><defs><radialGradient id="gl"><stop offset="0" stop-color="${a0}" stop-opacity=".4"/><stop offset="1" stop-color="${a0}" stop-opacity="0"/></radialGradient></defs><circle cx="${c}" cy="${cy}" r="${r*.7}" fill="url(#gl)"/>`;
 for(const k of [100,75,50,25])o+=`<polygon points="${poly(Array(6).fill(k))}" fill="${k===100?'rgba(255,255,255,.03)':'none'}" stroke="rgba(255,255,255,${k===100?.16:.08})"/>`;
 for(let i=0;i<6;i++){const [x,y]=pt(i,100);o+=`<line x1="${c}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.1)"/>`}
 if(one)o+=`<polygon points="${poly(Array(6).fill(55))}" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5" stroke-dasharray="4 5"/>`;
 series.slice().reverse().forEach((s,k)=>{o+=`<polygon points="${poly(s.v)}" fill="${s.c}" fill-opacity="${one?.28:.18}" stroke="${s.c}" stroke-width="3" stroke-linejoin="round"${k===0&&!one?' stroke-dasharray="7 4"':''}/>`;
  s.v.forEach((x,i)=>{if(x!=null){const [px,py]=pt(i,x);o+=`<circle cx="${px}" cy="${py}" r="${one?5:4}" fill="${s.c}" stroke="#0e1116" stroke-width="2"/>`}})});
 ax.forEach((a,i)=>{const [lx,vy]=pt(i,100),ty=[0,1,5].includes(i)?vy-26:vy+22;
  o+=`<text x="${lx}" y="${ty}" text-anchor="middle" fill="#dfe5ee" font-size="13" font-weight="600">${a}</text><text x="${lx}" y="${ty+17}" text-anchor="middle" font-size="16" font-weight="800">${
   series.map((s,k)=>`${k?'<tspan fill="#6b7383"> · </tspan>':''}<tspan fill="${s.c}">${s.v[i]??'—'}</tspan>`).join('')}</text>`});
 return o+'</svg>';
}
// подписи к цифрам показателей: что именно посчитано (raw — из team/site/app_data/build.py)
function rawTxt(t,i){const x=(t.raw||[])[i];if(x==null)return '';const f=(v,d)=>(+v).toFixed(d).replace('.',',');
 if(i===0)return f(x,2)+' гола за игру';if(i===1)return f(x,2)+' пропущ. за игру';if(i===2)return f(x*100,1)+'% отражённых';
 if(i===3)return t.lg==='nhl'?f(x*100,1)+'% реализация':f(x,2)+' гола в большинстве';if(i===4)return t.lg==='nhl'?f(x*100,1)+'% нейтрализация':f(x,2)+' пропущ. в меньшинстве';
 return x+' очков за 10 игр'}
function cmpTable(a,b,ca,cb){const ax=DB.axes||[];
 return `<div class="cmpt h"><span></span><span><i class="dot" style="background:${ca}"></i>${esc(a.name)}</span><span><i class="dot" style="background:${cb}"></i>${esc(b.name)}</span></div>`+
  ax.map((n,i)=>`<div class="cmpt"><span>${n}</span><b style="color:${ca}">${(a.axes||[])[i]??'—'}<small>${rawTxt(a,i)}</small></b><b style="color:${cb}">${(b.axes||[])[i]??'—'}<small>${rawTxt(b,i)}</small></b></div>`).join('')}
// ── Страница команды в цветах клуба: шестиугольник силы, игроки, сравнение с другой командой своей лиги
function team(name,tab,other){
 const t=T(name);if(!t)return {html:table(LG)};
 const [p,s,a]=t.colors||['#1b2a44','#2a3a5a','#3ee0ff'],acc=bright(a),ax=DB.axes||[],wide=WIDE(),enc=encodeURIComponent(name);
 document.body.style.background=`color-mix(in srgb, ${p} 10%, #0e1116)`;
 const frm=t.form?`форма <b>${esc(t.form)}</b>`:(t.l10s?`10 игр <b>${esc(t.l10s)}</b>`:'');
 const head=`<div class="th3" style="--p:${p};--s:${s}">${art(t,acc)}${img(name,'wm')}
  <div class="row1">${img(name,'em')}<div><h1>${esc(t.name)}</h1><div class="sub">${t.lg==='khl'?'КХЛ':'НХЛ'} · ${esc(t.conf||'')} · ${t.place}-е место${t.coach?' · тренер '+esc(t.coach.split(' ').slice(0,2).join(' ')):''}</div></div></div>
  <div class="pills"><span><b>${t.pts}</b> очков</span><span><b>${t.w}–${t.l}</b> В–П</span>${frm?`<span>${frm}</span>`:''}</div></div>
 <div class="tabs" style="--tab:${acc};background:rgba(0,0,0,.25)"><button class="${!tab?'on':''}" data-go="team/${enc}">Сила команды</button>${wide?'':`<button class="${tab==='players'?'on':''}" data-go="team/${enc}/players">Игроки</button>`}<button class="${tab==='vs'||tab==='pick'?'on':''}" data-go="team/${enc}/pick">Сравнить</button></div>`;
 const pl=t.players||[],gk=t.goalies||[];
 const players=(pl.length?`<div class="card"><div class="gh">Бомбардиры сезона</div><div class="pl h"><span>Игрок</span><span>И</span><span>Г+П</span><span>О</span></div>
    ${pl.map(x=>`<div class="pl"><span><b>${esc(x.n)}</b><small>${esc(x.pos||'')}${x.pm!=null?` · ${x.pm>0?'+':''}${x.pm}`:''}</small></span><span>${x.gp??''}</span><span>${x.g??0}+${x.a??0}</span><span><b>${x.pts??0}</b></span></div>`).join('')}</div>`:'')
   +(gk.length?`<div class="card${wide?'':' grow'}"><div class="gh">Вратари</div><div class="pl h"><span>Игрок</span><span>И</span><span>%ОБ</span><span>КН</span></div>
    ${gk.map(x=>`<div class="pl"><span><b>${esc(x.n)}</b><small>побед ${x.w??0}${x.so?' · на ноль '+x.so:''}</small></span><span>${x.gp??''}</span><span>${x.sv!=null?(+x.sv).toFixed(1).replace('.',','):'—'}</span><span>${x.gaa!=null?(+x.gaa).toFixed(2).replace('.',','):'—'}</span></div>`).join('')}</div>`:'')
   +(!pl.length&&!gk.length?`<div class="card grow"><div class="empty"><b>Статистики игроков пока нет</b></div></div>`:'');
 const power=`<div class="card${wide?'':' grow'}" style="background:rgba(255,255,255,.04);--tab:${acc}"><div class="gh" style="border-color:rgba(255,255,255,.06)">Сила команды<small>место в лиге, 0–100</small></div>
    <div class="rad">${radar([{v:t.axes||[],c:acc,name:t.name}],ax)}</div><div class="legend"><span><i></i>${esc(t.name)}</span><span><i class="d"></i>середина лиги</span></div>
    <button class="btn sec vsbtn" data-go="team/${enc}/pick">Сравнить с другой командой</button>
    <div class="note">Балл — место команды в своей лиге по этому показателю: 100 — лучшая, 10 — худшая. ${t.lg==='khl'?'Большинство и меньшинство — голы в большинстве и пропущенные в меньшинстве за игру.':'Большинство и меньшинство — реализация и нейтрализация по данным НХЛ.'} Форма — очки за последние 10 игр.</div></div>`;
 let body;
 if(tab==='pick'){ // выбор соперника — команды той же лиги по местам
  const rows=((DB.leagues||{})[t.lg]||[]).filter(r=>r.name!==name).sort((x,y)=>(x.conf||'').localeCompare(y.conf||'')||x.place-y.place);
  body=`<div class="card"><div class="gh">С кем сравнить ${esc(t.name)}?<small>${t.lg==='khl'?'КХЛ':'НХЛ'}</small></div>${rows.map(r=>`<a class="pick-t" href="#team/${enc}/vs/${encodeURIComponent(r.name)}"><span class="n">${r.place}</span>${img(r.name)}<span class="t">${esc(r.name)}<br><small>${esc(r.conf||'')} · ${r.pts} очков</small></span><span class="badge" style="background:rgba(255,255,255,.06);color:var(--fg)">Сравнить</span></a>`).join('')}</div>`;
 }else if(tab==='vs'&&T(other)){
  const o=T(other),cb=bright((o.colors||[])[2]),ca=acc===cb?'#ffffff':acc;
  body=`<div class="${wide?'teamgrid':''}" style="${wide?'':'display:contents'}"><div class="card" style="background:rgba(255,255,255,.04)"><div class="gh" style="border-color:rgba(255,255,255,.06)">${esc(t.name)} и ${esc(o.name)}<small>место в лиге, 0–100</small></div>
    <div class="rad">${radar([{v:t.axes||[],c:ca,name:t.name},{v:o.axes||[],c:cb,name:o.name}],ax)}</div>
    <div class="legend"><span><i style="border-color:${ca}"></i>${esc(t.name)}</span><span><i style="border-color:${cb};border-top-style:dashed"></i>${esc(o.name)}</span></div></div>
   <div class="card">${cmpTable(t,o,ca,cb)}<div class="gh" style="border-top:1px solid var(--line);border-bottom:0"><a href="${href(o.name)}" style="color:var(--acc)">Страница ${esc(o.name)}</a><small><a href="#team/${enc}/pick" style="color:var(--acc)">Другая команда</a></small></div></div></div>`;
 }else if(tab==='players'&&!wide)body=players;
 else body=wide?`<div class="teamgrid"><section>${power}</section><section style="display:flex;flex-direction:column;gap:12px">${trCard(t)}${players}</section></div>`:power+trCard(t);
 return {html:head+`<div class="main" style="padding-top:12px">${body}${note()}</div>`,head:p,acc,bg:art(t,acc,1)};
}

// ── переходы: #matches[/лига], #match/<хозяева|гости>, #results, #trends[/лига[/тренд]], #table[/лига], #video, #team/<клуб>[/players]
function render(){
 const parts=(location.hash.slice(1)||'matches').split('/').map(decodeURIComponent),[r,a,b]=parts;
 document.body.style.background='';
 if((r==='matches'||r==='table'||r==='trends')&&(a==='khl'||a==='nhl'))LG=a;
 let html,tab=r,head='#0e1116',acc=null,pbg='';
 if(r==='match'){html=match(a);tab='matches'}
 else if(r==='team'){const t=team(a,b,parts[3]);html=t.html;tab='table';head=t.head||head;acc=t.acc;pbg=t.bg}
 else if(r==='table')html=table(LG);
 else if(r==='results')html=results();
 else if(r==='trends')html=trends(LG,b);
 else if(r==='video')html=video();
 else{html=matches(LG);tab='matches'}
 scr.innerHTML=html;scr.scrollTop=0;nav(tab,acc);
 $('#pagebg').innerHTML=WIDE()?pbg:'';
 const inner=r==='match'||r==='team';
 $('#back').hidden=!inner;
 if(tg){inner?tg.BackButton.show():tg.BackButton.hide();try{tg.setHeaderColor(r==='team'?head:'#0e1116')}catch(e){}}
}
addEventListener('hashchange',()=>{haptic();render()});
matchMedia('(min-width:900px)').addEventListener('change',()=>DB&&render());   // телефон ↔ компьютер — другая раскладка
document.addEventListener('click',e=>{
 const go=e.target.closest('[data-go]');if(go){location.hash=go.dataset.go;return}
 const ln=e.target.closest('[data-link]');if(ln){openLink(ln.dataset.link);return}
 const act=e.target.closest('[data-act]');
 if(act&&act.dataset.act==='buy')(tg?tg.showAlert('Оплата появится позже. Сейчас доступ к таблице — через канал @jarvibet.'):alert('Оплата появится позже. Сейчас доступ — через канал @jarvibet.'));
});
const back=()=>history.length>1?history.back():(location.hash='matches');
$('#back').onclick=back;
if(tg){document.documentElement.classList.add('in-tg');tg.ready();tg.expand();try{tg.setBackgroundColor('#0e1116');tg.setHeaderColor('#0e1116')}catch(e){}tg.BackButton.onClick(back)}
fetch('bg/photos.json',{cache:'no-cache'}).then(r=>r.ok?r.json():[]).then(j=>{PHOTO=new Set(j);DB&&render()}).catch(()=>{});
fetch('data.json',{cache:'no-cache'}).then(r=>r.ok?r.json():Promise.reject()).then(j=>{DB=j}).catch(()=>{DB=SAMPLE}).finally(()=>{
 if(!(DB.games||[]).some(g=>g.lg===LG)&&(DB.games||[]).some(g=>g.lg==='nhl'))LG='nhl';render()});
</script>
</body>
</html>
