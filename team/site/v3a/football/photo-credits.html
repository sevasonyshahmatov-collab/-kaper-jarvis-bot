<!doctype html>
<html lang="ru" data-sport="football" data-theme="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Авторы фото игроков · JARVIS (макет v3a)</title>
<meta name="description" content="Откуда фотографии футболистов: файлы Wikimedia Commons и ссылки на страницы авторов.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#071225">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;600;700;800;900&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<link rel="stylesheet" href="../assets/v3a.css">
<link rel="stylesheet" href="../assets/football.css">
<link rel="stylesheet" href="../assets/players.css">
<style>.cr-l{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:0;max-width:900px}.cr-l li{display:flex;gap:12px;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--rule-2);font:500 16px/1.35 var(--display)}.cr-l a{color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.cr-l b{font-weight:800;white-space:nowrap}</style>
</head>
<body data-field="football">
<a class="skip" href="#main">К содержанию</a>
<header class="hd" id="hd">
  <div class="wrap">
    <a class="logo" href="../index.html" aria-label="JARVIS, на главную">JAR<i>V</i>IS</a>
    <nav class="seg" aria-label="Вид спорта">
      <a href="../hockey/index.html">Хоккей</a>
      <a href="index.html">Футбол</a>
      <a href="players.html" aria-current="page">Игроки</a>
    </nav>
  </div>
</header>
<main id="main" class="wrap pl">
  <section class="pl-hero">
    <p class="pl-kicker">Футбол · раздел «Игроки»</p>
    <h1>Авторы фото</h1>
    <p class="pl-lead">Портреты футболистов сделаны из фотографий <a href="https://commons.wikimedia.org" target="_blank" rel="noopener">Wikimedia Commons</a> (лицензии CC BY-SA и другие свободные): мы обрезали кадр и убрали фон. На странице каждого файла указаны автор и лицензия.</p>
  </section>
  <p class="pl-meta" id="n"></p>
  <ul class="cr-l" id="l"></ul>
  <p class="pl-note"><a href="players.html">← К игрокам</a></p>
</main>
<script src="data/players.js"></script>
<script>
(()=>{
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const N={};(window.JV_PLAYERS.players||[]).forEach(p=>{N[p.id]=p.n});
fetch('data/headshots.json').then(r=>r.ok?r.json():{}).then(j=>{
  const L=Object.keys(j||{}).filter(i=>j[i].ok&&N[i]).sort((a,b)=>N[a].localeCompare(N[b],'ru'));
  document.getElementById('n').textContent=L.length?'Фото: '+L.length:'Портреты пока готовятся.';
  document.getElementById('l').innerHTML=L.map(i=>`<li><b>${esc(N[i])}</b><a href="https://commons.wikimedia.org/wiki/File:${encodeURIComponent(j[i].f.replace(/ /g,'_'))}" target="_blank" rel="noopener">${esc(j[i].f)}</a></li>`).join('');
}).catch(()=>{});
})();
</script>
</body>
</html>
