<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Dela;src:url(DelaGothicOne-Regular.ttf)}
@font-face{font-family:Golos;src:url("GolosText[wght].ttf");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#140c08}
.wrap{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:
   radial-gradient(900px 700px at 50% 38%, rgba(255,170,60,.22), transparent 70%),
   repeating-linear-gradient(90deg, #2a1810 0 132px, #24150d 132px 135px, #2e1b11 135px 270px),
   #22140c;font-family:Golos;color:#fff4e6}
/* wood grain */
.wrap:before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(2deg, rgba(0,0,0,.0) 0 18px, rgba(0,0,0,.10) 18px 20px, rgba(255,200,140,.03) 20px 34px);}
.vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.72) 100%);}
svg.bg{position:absolute;inset:0}
.content{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center}
.top{margin-top:70px;text-align:center}
.kicker{font:700 26px Golos;letter-spacing:.32em;color:#ffcf7a;text-transform:uppercase}
h1{font:400 100px/0.95 Dela;margin-top:18px;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff1c9 0%,#ffb93d 55%,#e8731c 100%);-webkit-background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 #5a1d08) drop-shadow(0 16px 30px rgba(0,0,0,.6))}
.year{font:400 64px Dela;color:#e8401f;margin-top:6px;text-shadow:0 4px 0 #3a0e04, 0 0 30px rgba(232,64,31,.45)}
.tickets{margin-top:58px;display:flex;flex-direction:column;gap:56px;width:900px}
.t{position:relative;border-radius:30px;padding:30px 36px 28px;
  background:linear-gradient(180deg,rgba(32,18,10,.86),rgba(20,11,6,.9));
  border:2px solid rgba(255,190,90,.35);box-shadow:0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,160,.15);
  backdrop-filter:blur(3px)}
.row{display:flex;align-items:center;justify-content:space-between}
.team{display:flex;flex-direction:column;align-items:center;width:230px}
.team img{width:118px;height:118px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.team span{font:800 26px Golos;margin-top:10px;letter-spacing:.02em}
.mid{text-align:center;flex:1}
.lbl{font:600 18px Golos;letter-spacing:.24em;text-transform:uppercase;color:#ffcf7a;opacity:.85}
.bet{font:800 38px/1.12 Golos;margin-top:10px}
.odd{display:inline-block;margin-top:14px;font:400 34px Dela;color:#1b0f06;background:#ffb93d;border-radius:14px;padding:6px 20px 8px}
.stamp{position:absolute;top:-20px;right:-16px;transform:rotate(9deg);
  font:400 30px Dela;color:#fff;background:#2fae4f;border-radius:16px;padding:10px 22px 12px;
  box-shadow:0 10px 24px rgba(0,0,0,.5);border:3px solid #a8f0b8}
.num{position:absolute;top:-16px;left:30px;font:800 18px Golos;letter-spacing:.2em;color:#1b0f06;background:#ffcf7a;border-radius:10px;padding:5px 12px}
.foot{position:absolute;bottom:58px;left:0;right:0;text-align:center}
.score{font:400 64px Dela;color:#7ee38f;text-shadow:0 4px 0 #0d3a17,0 0 30px rgba(80,220,110,.35)}
.score small{font:800 26px Golos;color:#fff4e6;letter-spacing:.18em;text-transform:uppercase;display:block;margin-top:4px;text-shadow:none;opacity:.85}
.brand{margin-top:18px;font:700 24px Golos;letter-spacing:.3em;color:#ffcf7a;opacity:.8}
</style></head><body>
<div class="wrap">
<svg class="bg" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#ff6a3a"/><stop offset=".55" stop-color="#e2361a"/><stop offset="1" stop-color="#9d1d0c"/>
  </linearGradient>
  <radialGradient id="shine" cx=".35" cy=".3" r=".7"><stop offset="0" stop-color="#ffb08a" stop-opacity=".8"/><stop offset="1" stop-color="#ffb08a" stop-opacity="0"/></radialGradient>
  <g id="rak">
   <!-- antennae -->
   <path d="M92 70 C70 20 30 -10 -20 -40" stroke="#c42a14" stroke-width="3" fill="none"/>
   <path d="M108 70 C130 20 170 -10 220 -40" stroke="#c42a14" stroke-width="3" fill="none"/>
   <path d="M95 72 C85 45 70 35 55 30" stroke="#c42a14" stroke-width="2" fill="none"/>
   <path d="M105 72 C115 45 130 35 145 30" stroke="#c42a14" stroke-width="2" fill="none"/>
   <!-- legs -->
   <g stroke="#b9260f" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M78 120 L46 132 L34 150"/><path d="M78 135 L44 150 L36 170"/><path d="M80 150 L48 170 L44 190"/><path d="M82 163 L54 188 L52 206"/>
    <path d="M122 120 L154 132 L166 150"/><path d="M122 135 L156 150 L164 170"/><path d="M120 150 L152 170 L156 190"/><path d="M118 163 L146 188 L148 206"/>
   </g>
   <!-- claws arms -->
   <path d="M82 100 C60 92 46 76 40 52" stroke="url(#shell)" stroke-width="14" stroke-linecap="round" fill="none"/>
   <path d="M118 100 C140 92 154 76 160 52" stroke="url(#shell)" stroke-width="14" stroke-linecap="round" fill="none"/>
   <!-- pincers -->
   <g fill="url(#shell)" stroke="#7d160a" stroke-width="2">
    <path d="M40 56 C14 50 4 20 12 -14 C22 -4 30 14 36 30 C40 10 44 -6 52 -18 C64 6 62 40 46 58 Z"/>
    <path d="M160 56 C186 50 196 20 188 -14 C178 -4 170 14 164 30 C160 10 156 -6 148 -18 C136 6 138 40 154 58 Z"/>
   </g>
   <!-- carapace -->
   <path d="M100 58 C120 62 130 90 128 130 C126 165 116 178 100 180 C84 178 74 165 72 130 C70 90 80 62 100 58 Z" fill="url(#shell)" stroke="#7d160a" stroke-width="2"/>
   <path d="M100 58 L94 46 L100 38 L106 46 Z" fill="#d93a1c"/>
   <path d="M86 110 Q100 120 114 110" stroke="#7d160a" stroke-width="2" fill="none" opacity=".7"/>
   <circle cx="91" cy="70" r="4" fill="#1a0602"/><circle cx="109" cy="70" r="4" fill="#1a0602"/>
   <!-- tail segments -->
   <g fill="url(#shell)" stroke="#7d160a" stroke-width="2">
    <ellipse cx="100" cy="190" rx="26" ry="13"/><ellipse cx="100" cy="207" rx="24" ry="12"/>
    <ellipse cx="100" cy="223" rx="22" ry="11"/><ellipse cx="100" cy="238" rx="19" ry="10"/>
    <ellipse cx="100" cy="252" rx="16" ry="9"/>
    <path d="M100 258 L76 290 Q88 296 100 286 Q112 296 124 290 Z"/>
   </g>
   <ellipse cx="94" cy="105" rx="14" ry="34" fill="url(#shine)"/>
  </g>
  <!-- beer mug -->
  <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#ffd25a"/><stop offset=".6" stop-color="#f2a01c"/><stop offset="1" stop-color="#b4600a"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
   <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".15" stop-color="#fff" stop-opacity=".05"/>
   <stop offset=".8" stop-color="#fff" stop-opacity=".02"/><stop offset="1" stop-color="#fff" stop-opacity=".3"/>
  </linearGradient>
  <g id="mug">
   <!-- handle -->
   <path d="M196 90 C262 90 268 210 196 220" stroke="rgba(255,240,210,.55)" stroke-width="22" fill="none"/>
   <path d="M196 90 C262 90 268 210 196 220" stroke="rgba(255,255,255,.18)" stroke-width="6" fill="none" transform="translate(-4,-3)"/>
   <!-- body -->
   <rect x="10" y="40" width="190" height="250" rx="18" fill="url(#beer)"/>
   <g fill="#fff" opacity=".55">
    <circle cx="50" cy="240" r="3"/><circle cx="70" cy="200" r="2.5"/><circle cx="120" cy="260" r="3"/><circle cx="150" cy="180" r="2"/>
    <circle cx="90" cy="150" r="2.5"/><circle cx="160" cy="120" r="2"/><circle cx="40" cy="120" r="2"/><circle cx="130" cy="220" r="2.5"/>
   </g>
   <g stroke="rgba(120,60,0,.35)" stroke-width="6"><line x1="58" y1="70" x2="58" y2="270"/><line x1="105" y1="70" x2="105" y2="270"/><line x1="152" y1="70" x2="152" y2="270"/></g>
   <rect x="10" y="40" width="190" height="250" rx="18" fill="url(#glass)" stroke="rgba(255,240,210,.6)" stroke-width="5"/>
   <rect x="4" y="282" width="202" height="20" rx="8" fill="rgba(255,240,210,.5)"/>
   <!-- foam -->
   <g fill="#fffaf0">
    <circle cx="30" cy="40" r="30"/><circle cx="72" cy="22" r="34"/><circle cx="120" cy="26" r="32"/><circle cx="165" cy="34" r="30"/>
    <circle cx="190" cy="52" r="20"/><circle cx="14" cy="58" r="16"/><rect x="10" y="40" width="190" height="34"/>
    <path d="M30 70 Q34 100 26 112 Q20 100 24 70 Z"/>
    <path d="M150 70 Q156 95 150 104 Q143 95 146 70 Z"/>
   </g>
   <g fill="#e9dcc2"><circle cx="60" cy="40" r="5"/><circle cx="110" cy="34" r="4"/><circle cx="150" cy="44" r="5"/><circle cx="90" cy="54" r="3"/></g>
  </g>
 </defs>
 <!-- crayfish scattered -->
 <g opacity=".95">
  <use href="#rak" transform="translate(-30 1000) rotate(-35 100 150) scale(1.15)"/>
  <use href="#rak" transform="translate(880 120) rotate(150 100 150) scale(.9)" />
  <use href="#rak" transform="translate(-40 160) rotate(40 100 150) scale(.8)" opacity=".85"/>
  <use href="#rak" transform="translate(890 760) rotate(-150 100 150) scale(.85)" opacity=".9"/>
  <use href="#rak" transform="translate(250 1180) rotate(95 100 150) scale(.6)" opacity=".55"/>
 </g>
 <!-- mugs -->
 <use href="#mug" transform="translate(800 1010) rotate(6) scale(1.0)"/>
 <use href="#mug" transform="translate(-60 520) rotate(-10) scale(.75)" opacity=".85"/>
 <!-- dill sprigs -->
 <g stroke="#5f8f2c" stroke-width="3" fill="none" opacity=".8">
  
  <path d="M200 60 q40 30 50 80 M215 75 l22 -10 M230 95 l-22 6 M240 115 l24 -6"/>
 </g>
</svg>
<div class="vign"></div>

<div class="content">
 <div class="top">
  <div class="kicker">Специальный выпуск · КХЛ</div>
  <h1>КУБОК РАКОВ</h1>
  <div class="year">2026</div>
 </div>
 <div class="tickets">
  <div class="t">
   <div class="num">ОРДИНАР 1</div><div class="stamp">ЗАШЛА ✓</div>
   <div class="row">
    <div class="team"><img src="admiral.png"><span>Адмирал</span></div>
    <div class="mid"><div class="lbl">ставка</div><div class="bet">Тотал Адмирала<br>больше 2,5</div><div class="odd">2,01</div></div>
    <div class="team"><img src="barys.png"><span>Барыс</span></div>
   </div>
  </div>
  <div class="t">
   <div class="num">ОРДИНАР 2</div><div class="stamp">ЗАШЛА ✓</div>
   <div class="row">
    <div class="team"><img src="amur.png"><span>Амур</span></div>
    <div class="mid"><div class="lbl">ставка</div><div class="bet">Тотал матча<br>меньше 5,5</div><div class="odd">1,69</div></div>
    <div class="team"><img src="ska.png"><span>СКА</span></div>
   </div>
  </div>
 </div>
 <div class="foot">
  <div class="score">2 из 2<small>оба ординара зашли</small></div>
  <div class="brand">JARVIS · @jarvibet</div>
 </div>
</div>
</div>
</body></html>
