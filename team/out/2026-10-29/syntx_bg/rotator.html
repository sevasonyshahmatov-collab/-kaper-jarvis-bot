<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фон сайта — смена картинок</title>
<style>
:root{--hold:9000ms;--fade:2200ms}
html,body{margin:0;height:100%;background:#05080d;color:#f3efe6;font-family:system-ui,sans-serif}
.hero{position:relative;height:100vh;min-height:520px;overflow:hidden;isolation:isolate}
.slide{position:absolute;inset:0;background:var(--img) center/cover no-repeat;opacity:0;transition:opacity var(--fade) ease;will-change:opacity,transform}
.slide.on{opacity:1;animation:kb 14s ease-out forwards}
.slide.on.alt{animation-name:kb2}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.14) translate(-1.2%,-.8%)}}
@keyframes kb2{from{transform:scale(1.14) translate(1%,.6%)}to{transform:scale(1.04)}}
.shade{position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 45%,transparent,rgba(5,8,13,.55)),linear-gradient(180deg,rgba(5,8,13,.35),rgba(5,8,13,.1) 45%,rgba(5,8,13,.7))}
canvas{position:absolute;inset:0;width:100%;height:100%}
.t{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:0 16px}
.t h1{margin:0;font-size:clamp(34px,6vw,76px);letter-spacing:.04em;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.t p{opacity:.8;font-size:clamp(14px,2vw,22px);margin:.5em 0 0}
.dots{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots i{width:22px;height:3px;background:rgba(255,255,255,.25);border-radius:2px}
.dots i.on{background:#e8b75a}
@media (prefers-reduced-motion:reduce){.slide.on{animation:none}.slide{transition:none}canvas{display:none}}
</style>
<section class="hero" id="h" aria-label="JARVIS">
<div id="s"></div><canvas id="c"></canvas><div class="shade"></div>
<div class="t"><h1>JARVIS</h1><p>Прогнозы на хоккей КХЛ и НХЛ</p></div><div class="dots" id="d"></div></section>
<script>
// Список кадров: просто добавить файл — и он войдёт в смену.
const IMGS=['arena2.jpg','bg3.jpg','bg1.jpg','arena1.jpg','bg2.jpg'];
const HOLD=9000,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const box=document.getElementById('s'),dots=document.getElementById('d');
const sl=IMGS.map((u,i)=>{const e=document.createElement('div');e.className='slide'+(i%2?' alt':'');e.style.setProperty('--img',`url(${u})`);box.append(e);dots.append(document.createElement('i'));return e});
let k=-1;function go(){if(k>=0){sl[k].classList.remove('on');dots.children[k].classList.remove('on')}k=(k+1)%sl.length;sl[k].classList.add('on');dots.children[k].classList.add('on')}
Promise.all(IMGS.map(u=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=u}))).then(()=>{go();if(!rm){let t=setInterval(go,HOLD);document.addEventListener('visibilitychange',()=>{clearInterval(t);if(!document.hidden)t=setInterval(go,HOLD)})}});
const q=new URLSearchParams(location.search).get('k');if(q!==null)setTimeout(()=>{k=+q-1;go()},0);
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,P;
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:60},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.4,v:Math.random()*.25+.08,a:Math.random()*.5+.2}))}
rs();addEventListener('resize',rs);
(function f(){x.clearRect(0,0,W,H);for(const p of P){p.y+=p.v;p.x+=Math.sin(p.y/60)*.15;if(p.y>H){p.y=-5;p.x=Math.random()*W}x.fillStyle=`rgba(255,235,200,${p.a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}if(!rm)requestAnimationFrame(f)})();
</script></html>
