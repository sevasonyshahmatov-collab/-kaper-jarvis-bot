<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Фон — проба</title>
<style>
html,body{margin:0;height:100%;background:#05080d;color:#f3efe6;font-family:system-ui,sans-serif;overflow:hidden}
.hero{position:relative;height:100vh;overflow:hidden}
.bg{position:absolute;inset:0;background:var(--img) center 55%/cover;transform-origin:50% 60%;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.18) translate(-1.5%,-1%)}}
.glow{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 35%,rgba(255,200,110,.18),transparent 70%);mix-blend-mode:screen;animation:pulse 7s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,8,13,.55),rgba(5,8,13,.35) 40%,rgba(5,8,13,.85))}
canvas{position:absolute;inset:0;width:100%;height:100%}
.t{position:absolute;left:0;right:0;top:38%;text-align:center}
.t h1{margin:0;font-size:clamp(34px,6vw,76px);letter-spacing:.02em}.t p{opacity:.75;font-size:clamp(14px,2vw,22px)}
@media (prefers-reduced-motion:reduce){.bg,.glow{animation:none}}
</style>
<div class="hero" id="h"><div class="bg" id="bg"></div><div class="glow"></div><canvas id="c"></canvas><div class="shade"></div>
<div class="t"><h1>JARVIS</h1><p>Прогнозы на хоккей КХЛ и НХЛ</p></div></div>
<script>
const q=new URLSearchParams(location.search),n=q.get('bg')||'bg1';
document.getElementById('bg').style.setProperty('--img',`url(${n}.jpg)`);
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,P=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.4,v:Math.random()*.25+.08,a:Math.random()*.5+.2}))}
rs();addEventListener('resize',rs);
const rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
function f(){x.clearRect(0,0,W,H);for(const p of P){p.y+=p.v;p.x+=Math.sin(p.y/60)*.15;if(p.y>H){p.y=-5;p.x=Math.random()*W}x.fillStyle=`rgba(255,235,200,${p.a})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}if(!rm)requestAnimationFrame(f)}f();
</script></html>
